# The coordinator, on Cloudflare.
#
#   cd worker && npx wrangler deploy
#
# §4's reasoning, unchanged: you own no port, no VM, no cert and no tunnel
# daemon. Hosts open an outbound WebSocket and a Durable Object pins it; the
# phone speaks HTTPS to the same origin. This is not a tunnel — nothing is
# aimed at your boxes, they are ordinary clients.
#
# DEPLOYING THIS FILE REPLACES THE WORKER NAMED BELOW on whatever account
# wrangler is logged into. The name deliberately matches
# wrangler.production.toml — same script, so `wrangler secret put` reaches one
# place and a deploy from either file replaces the same Worker — which cuts
# the other way too: on OUR account, a bare `wrangler deploy` here, or the
# root `npm run deploy`, overwrites the production coordinator with this
# empty [vars]. Nothing goes red; sign-in answers 503 for every phone, push
# switches off, and the GitHub App flow breaks, all silently. Ours deploys
# through CI with `--config wrangler.production.toml`; deploying ours by hand
# needs that same flag, and the root deploy script prints which config it is
# about to send for exactly this reason.

name = "agent-fleet-coordinator"
main = "src/worker.js"
compatibility_date = "2026-01-15"

# nodejs_als, NOT nodejs_compat, and the difference is the whole of the note
# below. The Sentry SDK needs AsyncLocalStorage to associate an error with the
# request that caused it; `nodejs_als` provides exactly that one API, while
# `nodejs_compat` pulls in the whole polyfill surface this file spent a
# paragraph declining. The objection was cold start, and it still stands — this
# is the smallest flag that answers it.
compatibility_flags = ["nodejs_als"]

# nodejs_compat is not enabled, and that is a choice rather than a limitation.
#
# Workers runs npm packages and, with this flag, most of the node: built-ins —
# so nothing here is off-limits. What the flag costs is bundle size and cold
# start, and §4 picked this platform for a requirement measured in exactly that:
# "Hey Siri, resume bigjob" from cellular, on a cold radio, in under a second.
#
# The code the Worker imports — coordinator/core.js and push.js, and what they
# import in turn — happens to need only fetch and crypto.subtle, both of which
# are standard here and in Node. So the flag buys nothing today.
#
# If something genuinely needs a node: built-in or an npm package that pulls
# one in, add:
#
#     compatibility_flags = ["nodejs_compat", "nodejs_als"]
#
# UPDATE, 1 Sep 2026: `nodejs_als` is now set, for Sentry. That is the narrow
# flag — one API, AsyncLocalStorage — and the reasoning above is unchanged for
# the broad one. What error reporting DOES cost is bundle: 145 KB minified
# before it and 327 KB after, measured rather than estimated. If a cold start
# on cellular ever misses the second this file is written around, the SDK is
# the first thing to try removing, and SENTRY_DSN being unset already disables
# it without a deploy of code.
#
# and it will work. There is no rule being enforced; `wrangler deploy --dry-run`
# in CI simply reports the truth either way.

# The origin a host pins and a phone talks to. custom_domain = true makes
# Cloudflare create and manage the DNS record and the certificate for it, which
# is the difference between this and a plain route — there is nothing to point
# anywhere by hand.
#
# The hostname matters more here than it looks: §5 has the host agent PIN the
# coordinator origin, so changing it means editing every host's
# /etc/agent-fleet-sidecar.env. It is not a value to churn.
#
# NO ROUTES, WHICH MEANS THIS FILE IS SAFE TO DEPLOY AND DOES NOT REACH ANYBODY.
#
# `routes` named `fleet.thetech.network` with `custom_domain = true`, in the
# file this repository publishes as its default — so `wrangler deploy` from a
# fork tried to bind a domain they do not own and failed, and the Deploy to
# Cloudflare button on the README was broken for every fork.
#
# Add your own here, or deploy to workers.dev and point the apps at that. Ours
# is in wrangler.production.toml, which is the file that is ours.
#
# `custom_domain = true` is what makes wrangler create the DNS record and the
# certificate, so there is nothing to point anywhere by hand.
#
# routes = [
#   { pattern = "fleet.example.org", custom_domain = true }
# ]


# --- plain configuration, deployed with the code -----------------------------
#
# NOTHING HERE IDENTIFIES A PARTICULAR DEPLOYMENT, and that is the point.
#
# This table used to hold our allowlist, our Sentry project, our GitHub App and
# our invite sender. A fork that deployed this file unchanged got a coordinator
# that admitted four of OUR addresses to their fleet — `trust.md` has
# coordinator → host as trusted absolutely — posted their errors to our Sentry,
# and served an installer that put our code on their machines.
#
# The code was never wrong about any of it. The comment beside the allowlist
# still says "Empty ALLOW means nobody, deliberately", and sentry.js still says
# an unset DSN posts nowhere. The committed VALUES defeated both, which is the
# failure app-parity.md exists to name: a document asserting something the
# configuration makes untrue.
#
# So this file is now the fork-safe default and ours lives in
# wrangler.production.toml. Everything structural below — the Durable Object,
# the migrations, the rate limits — is identical in both and pinned equal by
# test/fork-safe-config.test.js, because a fork needs those exactly as much as
# we do.
#
# WHAT TO SET, AND WHAT HAPPENS IF YOU DO NOT. Every one of these is absent
# here on purpose, and every absence has a defined, honest behaviour:
#
#   AGENT_FLEET_AUTH_ISSUERS      who may vouch for a person. Unset → sign-in
#   AGENT_FLEET_AUTH_AUDIENCES    and which app the ID token is for.  answers
#                                 503 and says so. Copy ours verbatim if you
#                                 want the App Store and Play builds to sign in
#                                 to your coordinator — they are public
#                                 identifiers and this needs no Apple or Google
#                                 account of your own. See
#                                 docs/coordinator-deploy.md.
#   AGENT_FLEET_DOCS_URL          /docs. Unset → 404
#   AGENT_FLEET_INSTALL_URL       /install. Unset → 404 naming this variable.
#                                 bootstrap.sh clones the repository it is
#                                 served from, so pointing this at somebody
#                                 else's installs THEIR code on your machines
#   AGENT_FLEET_PUSH              unset → notifications are logged, not sent,
#                                 and the coordinator says so at startup
#   AGENT_FLEET_GITHUB_*          unset → the paste route, which is a
#                                 first-class answer rather than a fallback
#   AGENT_FLEET_NAME              unset → invitations are not sent, and the
#   AGENT_FLEET_INVITE_FROM       reply says which happened
#   AGENT_FLEET_APP_IOS/_ANDROID  unset → an invitation with no app links
#   SENTRY_DSN                    unset → no error reporting at all
#
# AGENT_FLEET_AUTH_ALLOW IS NOT IN THIS LIST because it is a `wrangler secret`
# rather than a var. It decides who can reach a fleet; it does not belong in a
# public repository, and the secret block at the bottom of this file has listed
# it as a secret all along. The `[vars]` entry was the bug.
[vars]

# RUNNERS, which a fleet has none of until these are set. All three are public
# operator decisions rather than secrets, so they belong here — see
# docs/runner-central.md and install/runner-central/README.md.
#
#   AGENT_FLEET_RUNNER_REPO       where `provision` dispatches, as owner/repo.
#                                 Hosts learn it on the config frame, so no box
#                                 is configured with it.
#   AGENT_FLEET_ACTIONS_REPOS     which repositories may enrol a host at all.
#                                 EMPTY MEANS NOBODY, deliberately: a deployment
#                                 that has not said has not opted in.
#   AGENT_FLEET_ACTIONS_WORKFLOW  which FILES in them may. Without it any
#                                 workflow there can admit a machine, including
#                                 one a pull request adds. A comma-separated
#                                 list, one entry per operating system, each
#                                 ending at the `@` so it pins the file and
#                                 allows any ref.
#
# AGENT_FLEET_RUNNER_REPO = "you/your-runners"
# AGENT_FLEET_ACTIONS_REPOS = "you/your-runners"
# AGENT_FLEET_ACTIONS_WORKFLOW = "you/your-runners/.github/workflows/runner-macos.yml@,you/your-runners/.github/workflows/runner-linux.yml@,you/your-runners/.github/workflows/runner-windows.yml@,you/your-runners/.github/workflows/runner-android.yml@"

[[send_email]]
name = "EMAIL"
# `remote = true` so a local `wrangler dev` sends through the real service
# rather than failing on a binding the local runtime cannot provide. Sending an
# invitation is not a thing to discover works only in production.
remote = true

# Signing in is the other route reachable without a credential, and it does real
# work for an anonymous caller: fetch a key set, verify a JWT, and on success
# write a client record. Ten a minute per address is more than a person tapping
# a button and less than anything worth doing with somebody else's CPU.
#
# Namespace 1002 rather than 1001, which the demo Worker uses. The budgets
# cannot be shared now that the scripts are not — a script hammering the demo
# fleet reaches a different Worker entirely — but the numbers stay distinct so
# nothing depends on that being remembered.
[[ratelimits]]
name = "SIGNIN_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[durable_objects.bindings]]
name = "FLEET"
class_name = "Fleet"

# One DO instance holds every host socket and the device registry, so there is
# exactly one place that knows the fleet. A fleet is tens of hosts, not
# thousands — sharding this would add a consistency problem to buy headroom
# nobody needs.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Fleet"]

[observability]
enabled = true

# --- secrets, set with `wrangler secret put NAME` ----------------------------
#
#   AGENT_FLEET_API_TOKEN             break-glass admin, and OPTIONAL. Phones do
#                                     not use it, hosts do not use it, and a
#                                     coordinator with sign-in configured and no
#                                     admin token is not open — it simply has no
#                                     way back in when sign-in itself is broken.
#                                     Set it or do not; what the coordinator
#                                     refuses to run without is ANY way in at
#                                     all, which means this or the AUTH_ pair
#   AGENT_FLEET_AUTH_ALLOW            who is allowed in: whole addresses, or
#                                     @domain. EMPTY ALLOWS NOBODY, on purpose
#
# Those two are also declared in .dev.vars.example, which is what makes the
# Deploy to Cloudflare dialog ask for them at deploy time — so a button deploy
# starts life with a way in, before its owner has touched [vars]. The push
# secrets below stay out of it: optional.
#
# AGENT_FLEET_AUTH_ISSUERS and _AUDIENCES are NOT in this list: they are public
# identifiers and belong in [vars] above, where changing who a coordinator will
# accept is a reviewable diff. This block briefly listed them as secrets, and
# because Cloudflare keeps vars and secrets in one namespace, following both
# halves of this file at once would have had a deploy clobber the secret — one
# place per name, and for these the [vars] table is the place.
#
# THERE IS NO HOST TOKEN. Hosts keep a keypair and sign a nonce per connection;
# they enrol with a six-digit pin minted by somebody already in. AGENT_FLEET_HOST_TOKEN
# was one string every machine presented — indistinguishable hosts, no way to
# revoke one, replayable by anything that saw a single connection.
#   AGENT_FLEET_FCM_SERVICE_ACCOUNT   the Firebase service-account JSON (or
#                                     base64 of it), for push
#   AGENT_FLEET_APNS_KEY              the .p8, for push to iOS
#   AGENT_FLEET_APNS_KEY_ID           which key that is
#   AGENT_FLEET_APNS_TEAM_ID          the team it belongs to
#
# The key id and team id are identifiers rather than credentials, and were
# briefly a [vars] entry for that reason. They are secrets now because a name
# cannot be both: Cloudflare keeps vars and secrets in one namespace, so a
# deploy carrying a var CLOBBERS the secret of the same name. One place per
# name, and for these the useful place is beside the .p8 they describe.
#
# AGENT_FLEET_DEMO_TOKEN is not here and is not in this file at all any more:
# it belongs to wrangler.demo.toml, along with the fleet it describes.
#
# With NEITHER the admin token NOR the AUTH_ pair, the Worker refuses every
# request rather than running open — there is no way for anybody to
# authenticate, and it says so (worker.js). Without just the AUTH_ pair,
# sign-in answers 503 and the admin token is the only way in. Without the FCM
# service account, push is logged instead of sent, and says so.
