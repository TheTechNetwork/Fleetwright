# The coordinator, on Cloudflare.
#
#   cd worker && npx wrangler deploy
#
# §4's reasoning, unchanged: you own no port, no VM, no cert and no tunnel
# daemon. Hosts open an outbound WebSocket and a Durable Object pins it; the
# phone speaks HTTPS to the same origin. This is not a tunnel — nothing is
# aimed at your boxes, they are ordinary clients.

name = "agent-fleet-coordinator"
main = "src/worker.js"
compatibility_date = "2026-01-15"
# nodejs_compat is NOT needed: src/fleet/coordinator/core.js, scheduler.js,
# registry.js, protocol/intents.js and push.js deliberately import nothing from
# node:, so the same files run here and under Node unmodified.

[[durable_objects.bindings]]
name = "FLEET"
class_name = "Fleet"

# One DO instance holds every host socket and the device registry, so there is
# exactly one place that knows the fleet. A fleet is tens of hosts, not
# thousands — sharding this would add a consistency problem to buy headroom
# nobody needs.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Fleet"]

[observability]
enabled = true

# --- secrets, set with `wrangler secret put NAME` ----------------------------
#
#   AGENT_FLEET_HOST_TOKEN            what a host presents to connect
#   AGENT_FLEET_API_TOKEN             what a phone or Shortcut presents
#   AGENT_FLEET_FCM_SERVICE_ACCOUNT   the Firebase service-account JSON, for push
#
# Without the first two the Worker refuses every request rather than running
# open — see worker.js. Without the third, push is logged instead of sent, and
# says so.
