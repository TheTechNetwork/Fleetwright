# The coordinator, on Cloudflare.
#
#   cd worker && npx wrangler deploy
#
# §4's reasoning, unchanged: you own no port, no VM, no cert and no tunnel
# daemon. Hosts open an outbound WebSocket and a Durable Object pins it; the
# phone speaks HTTPS to the same origin. This is not a tunnel — nothing is
# aimed at your boxes, they are ordinary clients.

name = "agent-fleet-coordinator"
main = "src/worker.js"
compatibility_date = "2026-01-15"

# nodejs_compat is not enabled, and that is a choice rather than a limitation.
#
# Workers runs npm packages and, with this flag, most of the node: built-ins —
# so nothing here is off-limits. What the flag costs is bundle size and cold
# start, and §4 picked this platform for a requirement measured in exactly that:
# "Hey Siri, resume bigjob" from cellular, on a cold radio, in under a second.
#
# The code the Worker imports — coordinator/core.js and push.js, and what they
# import in turn — happens to need only fetch and crypto.subtle, both of which
# are standard here and in Node. So the flag buys nothing today.
#
# If something genuinely needs a node: built-in or an npm package that pulls
# one in, add:
#
#     compatibility_flags = ["nodejs_compat"]
#
# and it will work. There is no rule being enforced; `wrangler deploy --dry-run`
# in CI simply reports the truth either way.

# The origin a host pins and a phone talks to. custom_domain = true makes
# Cloudflare create and manage the DNS record and the certificate for it, which
# is the difference between this and a plain route — there is nothing to point
# anywhere by hand.
#
# The hostname matters more here than it looks: §5 has the host agent PIN the
# coordinator origin, so changing it means editing every host's
# /etc/agent-fleet-sidecar.env. It is not a value to churn.
#
# TWO CUSTOM DOMAINS, ONE WORKER, and the second one is a boundary rather than
# a convenience. `fleetdemo` answers only from the invented fleet in
# worker/src/demo.js: worker.js checks the hostname ABOVE the host routes, so a
# request there never reaches enrolment, a websocket, sign-in, or the Durable
# Object. Same code, same deploy, and no credential that can cross between
# them — which is a much shorter thing to verify than "the demo branch runs
# first".
#
# `custom_domain = true` makes wrangler create the DNS record and the domain
# binding on deploy, so adding a demo host is this line and nothing manual.
routes = [
  { pattern = "fleet.thetech.network", custom_domain = true },
  { pattern = "fleetdemo.thetech.network", custom_domain = true }
]

# --- plain configuration, deployed with the code -----------------------------
[vars]
# The demo credential, and deliberately NOT a secret.
#
# It authorises exactly one thing: reading the fabricated fleet in
# worker/src/demo.js. Every reply is built from constants, the Durable Object
# is never fetched, and /host/connect refuses it — so there is nothing for a
# holder of this string to reach. Publishing it costs Worker invocations and
# nothing else, and in exchange there is no secret to rotate, no manual step
# before a deploy, and no way for App Store review to be blocked on somebody
# being awake to paste a value.
#
# It is prefixed `demo-` so that a request carrying it is obvious in a log at a
# glance, rather than being one opaque hex string among three.
AGENT_FLEET_DEMO_TOKEN = "demo-3a2ec7773eabcd4e38a9a880296a4e4b"

# Which hostname IS the demo. Named here rather than hardcoded in worker.js so
# there is one place to change it, and so a second deployment of this Worker can
# have its own — or none, which is what local dev and any fork gets by default.
#
# Setting this is what makes the demo structural instead of careful: on this
# hostname there is no route to a host, a session or the Durable Object, so the
# credential above stops being the thing standing between a curious person and
# somebody's real work.
AGENT_FLEET_DEMO_HOST = "fleetdemo.thetech.network"

# --- who is allowed to sign in ----------------------------------------------
# Identifiers, not credentials: the issuer is public, the audience is the client
# id an app ships anyway, and the allowlist is a list of colleagues. Keeping
# them here means changing who can reach a fleet is a reviewable diff rather
# than a value somebody edited in a web form at midnight.
#
# Empty ALLOW means nobody, deliberately — see src/fleet/coordinator/oidc.js.
AGENT_FLEET_AUTH_ISSUERS = "https://accounts.google.com,https://appleid.apple.com"

# TWO audiences, because the two providers issue for different things. Apple
# issues for the iOS BUNDLE ID; Google issues for the OAuth WEB client id
# (client_type 3 in google-services.json) that the Android app names as its
# server client — NOT for either of the Android client ids sitting next to it
# in that file, which are what the request is authorised by rather than what
# the token is issued for. `aud` is what gets verified.
AGENT_FLEET_AUTH_AUDIENCES = "network.thetech.fleetwright,654943059314-kosvngt4ggmdguksogppoiglo48nvm2i.apps.googleusercontent.com"

# Matched against the VERIFIED EMAIL in the ID token, so it must be the address
# actually signed in with, not the one that ought to work. A bare `@domain`
# entry matches the whole domain; anything else must match in full.
#
# `@thetech.network` alone would refuse the person who owns this fleet — the
# Google account here is a gmail one, and the refusal reads "… is not on this
# fleet's list", which is accurate and sounds like a bug. Sign in with Apple
# will present whatever address that Apple ID uses, which may be a third one
# again; add it when it is known rather than guessing at it now.
AGENT_FLEET_AUTH_ALLOW = "@thetech.network,elibrody2@gmail.com"

# Rate limit for the demo token, since the token is public and the point of
# publishing it was to stop it needing an operator. 60 requests a minute per
# client address is far more than a person tapping around an app and far less
# than anything worth doing with a hundred thousand free requests a day.
#
# Keyed on the client address rather than the token: a single abuser must not
# be able to lock out an App Store reviewer by exhausting a shared budget.
[[ratelimits]]
name = "DEMO_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Signing in is the other route reachable without a credential, and it does real
# work for an anonymous caller: fetch a key set, verify a JWT, and on success
# write a client record. Ten a minute per address is more than a person tapping
# a button and less than anything worth doing with somebody else's CPU.
#
# A separate namespace from the demo budget on purpose: sharing one would mean a
# script hammering the demo fleet could stop real people signing in.
[[ratelimits]]
name = "SIGNIN_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[durable_objects.bindings]]
name = "FLEET"
class_name = "Fleet"

# One DO instance holds every host socket and the device registry, so there is
# exactly one place that knows the fleet. A fleet is tens of hosts, not
# thousands — sharding this would add a consistency problem to buy headroom
# nobody needs.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Fleet"]

[observability]
enabled = true

# --- secrets, set with `wrangler secret put NAME` ----------------------------
#
#   AGENT_FLEET_API_TOKEN             break-glass admin. NOT what phones use
#   AGENT_FLEET_AUTH_ISSUERS          who may vouch for a person, e.g.
#                                     https://appleid.apple.com https://accounts.google.com
#   AGENT_FLEET_AUTH_AUDIENCES        which app the ID token must be for — the
#                                     iOS bundle id, the Android web client id
#   AGENT_FLEET_AUTH_ALLOW            who is allowed in: whole addresses, or
#                                     @domain. EMPTY ALLOWS NOBODY, on purpose
#
# THERE IS NO HOST TOKEN. Hosts keep a keypair and sign a nonce per connection;
# they enrol with a six-digit pin minted by somebody already in. AGENT_FLEET_HOST_TOKEN
# was one string every machine presented — indistinguishable hosts, no way to
# revoke one, replayable by anything that saw a single connection.
#   AGENT_FLEET_FCM_SERVICE_ACCOUNT   the Firebase service-account JSON (or
#                                     base64 of it), for push
#   AGENT_FLEET_APNS_KEY              the .p8, for push to iOS
#   AGENT_FLEET_APNS_KEY_ID           which key that is
#   AGENT_FLEET_APNS_TEAM_ID          the team it belongs to
#
# The key id and team id are identifiers rather than credentials, and were
# briefly a [vars] entry for that reason. They are secrets now because a name
# cannot be both: Cloudflare keeps vars and secrets in one namespace, so a
# deploy carrying a var CLOBBERS the secret of the same name. One place per
# name, and for these the useful place is beside the .p8 they describe.
#
# AGENT_FLEET_DEMO_TOKEN is NOT here: it is a [vars] entry below, because it
# guards nothing worth guarding. See the comment on it.
#
# Without AGENT_FLEET_API_TOKEN the Worker refuses every request rather than
# running open — see worker.js. Without the AUTH_ pair, sign-in answers 503 and
# says so, which leaves the admin token as the only way in. Without the FCM
# service account, push is logged instead of sent, and says so.
