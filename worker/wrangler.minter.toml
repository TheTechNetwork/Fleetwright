# The minting Worker: the GitHub App's private key, and nothing else.
#
#   cd worker && npx wrangler deploy --config wrangler.minter.toml
#
# A SEPARATE SCRIPT FROM THE COORDINATOR. The coordinator is internet-facing
# and this project treats it as compromised, so the key that mints for every
# installation of the App is not in it. It is here, and the coordinator reaches
# it through a service binding named MINTER (wrangler.production.toml) to ask
# for one runner's repository token at a time. src/fleet/minter/answer.js is
# what it checks, against GitHub, before it signs anything.
#
# Read this file as the security boundary: no routes, no workers.dev address,
# no preview URLs — nothing on the internet can call it — and one binding, to a
# Durable Object of its own. It cannot reach the fleet, a session or a host; it
# can sign a JWT with the App's key, open what people seal to its deposit key,
# keep that in its own storage, and talk to api.github.com.
name = "fleetwright-minter"
main = "src/minter.js"
compatibility_date = "2026-01-15"

workers_dev = false
preview_urls = false

# WHAT IT NEEDS, none of which is in this file:
#
#   FLEETWRIGHT_GITHUB_APP_KEY        SECRET. The App's private key, the PEM
#                                     GitHub downloads (PKCS#1 is fine). Set
#                                     with `wrangler secret put --config
#                                     wrangler.minter.toml`, or by the deploy
#                                     workflow from the repository secret of
#                                     the same name. Unset → it mints nothing,
#                                     and the coordinator asks a permanent box
#                                     that holds the key instead, if any does
#   FLEETWRIGHT_GITHUB_CLIENT_ID      the App's client id, the JWT's issuer.
#                                     Public; the deploy passes it with --var
#   FLEETWRIGHT_GITHUB_MINT_OWNERS    the GitHub accounts whose repositories
#                                     it may mint into, comma separated.
#                                     EMPTY MINTS FOR NOBODY: the App is
#                                     installable by any account, and this is
#                                     where "not a guest's" is decided. The
#                                     deploy passes it with --var. It also says
#                                     which runner repositories besides a
#                                     person's own may be given their Claude
#                                     login
#   FLEETWRIGHT_GITHUB_CLIENT_SECRET  SECRET. The App's client secret, for
#                                     finishing a phone's own GitHub sign-in
#                                     (src/fleet/minter/github.js), so it is
#                                     never shipped in an app and the token
#                                     never comes back through the coordinator.
#                                     Synced by the same manual job. Unset →
#                                     phones cannot sign in to GitHub
#                                     themselves, and start runners through a
#                                     permanent box as before
#   FLEETWRIGHT_CLOUDFLARE_CLIENT_ID  the Cloudflare OAuth client the coordinator
#                                     signs people in with. Public; the deploy
#                                     reads it from the coordinator's config and
#                                     passes it with --var
#   FLEETWRIGHT_CLOUDFLARE_CLIENT_SECRET  SECRET. That client's secret, so the
#                                     vault (src/fleet/minter/vault.js) can finish
#                                     and renew a person's Cloudflare sign-in.
#                                     Synced by the same manual job. Unset →
#                                     vaults keep no Cloudflare sign-in
#   FLEETWRIGHT_MINTER_DEPOSIT_KEY    SECRET. The P-256 key people seal their
#                                     Claude logins to, as the JWK
#                                     `node scripts/minter-deposit-key.mjs`
#                                     prints. Unset → it keeps no Claude
#                                     logins and no vaults (docs/vault.md),
#                                     and every runner uses its repository's
#                                     API key, as before

[observability]
enabled = true

# THE CLAUDE LOGINS PEOPLE DEPOSIT, one row per GitHub account, each still
# sealed to the deposit key (src/fleet/minter/claude.js). A Durable Object
# rather than KV so a fork deploys this file as it is: a namespace belongs to
# the script that declares it and needs no id created first. No other script
# is bound to it, the coordinator included.
[[durable_objects.bindings]]
name = "LOGINS"
class_name = "ClaudeLogins"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClaudeLogins"]
