name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # agent-hub has no runtime dependencies and no build step; the only
      # install is the typescript devDependency used for type-checking.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck

      # The installer is the thing a new operator runs first, so a syntax error
      # in it is a worse bug than one in the service.
      - run: bash -n install/install.sh
