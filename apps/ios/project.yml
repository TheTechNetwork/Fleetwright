# XcodeGen spec, rather than a hand-written .xcodeproj.
#
#   brew install xcodegen && xcodegen generate && open Fleetwright.xcodeproj
#
# A project.pbxproj is a 40-kilobyte generated file with UUID cross-references;
# hand-writing one is how you get a project that opens on the machine it was
# written on and nowhere else. This is the source of truth, it is reviewable in
# a diff, and Xcode's version of it is regenerated on demand.
#
# design.md §9 is explicit that this app cannot be built or tested in the
# environment it was written in — no macOS, no Xcode, no signing identity. It is
# REVIEWED BUT UNRUN until somebody opens it on a Mac. That is stated here
# rather than discovered.

name: Fleetwright
options:
  bundleIdPrefix: network.thetech
  deploymentTarget:
    # iOS 26, for Liquid Glass — the tab bar that minimises on scroll, the glass
    # materials, and the button styles are all 26-only APIs, and guarding every
    # one of them behind `if #available` would mean maintaining two designs to
    # ship one.
    #
    # THE COST IS REAL AND WORTH STATING, exactly as the Android side states it:
    # this excludes anybody who has not updated. Same posture as `minSdk = 36`
    # over there — one version back, deliberately, on an app with no installed
    # base to keep working.
    #
    # 26 rather than 27, and it stays 26 when 27 ships next week. Targeting an
    # OS that is not out yet means nobody can run the build and CI has no SDK
    # for it; targeting the one before means the rule above is satisfied the day
    # it lands, without a change. Move this when 28 is announced, not before.
    iOS: "26.0"

# Error reporting. Pinned to an exact version rather than a range, like every
# other dependency in this repository — a range is a build that changes without
# a commit.
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.26.1

targets:
  Fleetwright:
    type: application
    platform: iOS
    sources:
      - path: Fleetwright
    dependencies:
      - package: Sentry
    info:
      # WRITTEN, not read. XcodeGen creates this plist on every generation, so
      # the file on disk is output — it is gitignored, and editing it there is
      # editing something that is overwritten before it is ever compiled.
      # CFBundleIdentifier, CFBundleName, CFBundleShortVersionString and
      # CFBundleVersion are filled in by XcodeGen from the settings below; the
      # version to bump for a TestFlight build is MARKETING_VERSION.
      path: Fleetwright/Info.plist
      properties:
        # CLEARTEXT IS OFF, and this key does not turn it on — it narrows the
        # default rather than widening it. ATS already refused plain http
        # everywhere; NSAllowsLocalNetworking carves out loopback and .local, so
        # a coordinator running on the same machine works while nothing else
        # over http does. Fleet.swift refuses the same set, so the app's rule
        # and the platform's rule are one rule and cannot drift apart.
        #
        # NSAllowsArbitraryLoads is deliberately absent. It is the key that
        # would make the CodeQL cleartext finding real, and App Review asks for
        # a justification for it that this app does not have.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # THE DSN, READ AT LAUNCH. Not a secret — it identifies a project and
        # grants only the ability to post events to it. Empty means no
        # reporting, which is what a fork or a fresh clone gets; FleetwrightApp
        # returns early rather than starting the SDK.
        SentryDSN: https://62d7ede761c48f65f65f07dc94b7a4ee@o4512012096765952.ingest.us.sentry.io/4512012119769088
        CFBundleDisplayName: Fleetwright
        # OTHER NAMES SIRI WILL ACCEPT FOR THIS APP.
        #
        # Apple requires \(.applicationName) in every AppShortcut phrase, which
        # by default forces somebody to say a brand name to reach their own
        # work. "Start a session in Fleetwright" asks them to hold the server,
        # Claude, the project AND our product name in one sentence — and ours is
        # the only one of those four they do not care about.
        #
        # These are the words people actually use for the thing. Any of them
        # satisfies Apple's rule, so "start a dev session on my fleet" and
        # "start a dev session on my agents" both work without anybody being
        # taught a name.
        #
        # It is not the whole answer — a phrase with NO app name in it has to be
        # a shortcut the user makes, which is what the Siri section of settings
        # is for. This is the part that needs no setup at all.
        #
        # ARRAY OF DICTIONARIES, not of strings. A plain list here builds and
        # then fails at AppIntentsSSUTraining with "Unable to parse Info.plist"
        # — the Siri language processor reads this key and a shape it does not
        # expect stops the whole build rather than being ignored. Each entry is
        # a dict with an INAlternativeAppName key.
        # THREE, AND NOT MORE. App Store Connect rejects the upload:
        #
        #   ITMS-90626: Invalid Siri Support - There are too many name
        #   synonyms in the 'en' language. There should be no more than 3
        #   synonyms for this language.
        #
        # It builds, signs and uploads with six and is refused on the far side,
        # so the compiler cannot help here and neither can CI. Adding a fourth
        # costs a round trip through App Store Connect.
        #
        # These three, of the six that were here: "my fleet" for the machines,
        # "my agents" for the things running on them, and "remote sessions" for
        # people who think in terms of the work rather than either. Dropped:
        # "the fleet" and "agent fleet" are near-duplicates of the first, and
        # "my sessions" is close enough to the third to be worth less than the
        # slot it takes.
        INAlternativeAppNames:
          - INAlternativeAppName: my fleet
          - INAlternativeAppName: my agents
          - INAlternativeAppName: remote sessions
        # Bound to the build settings, not left to XcodeGen.
        #
        # XcodeGen fills these two in itself when they are absent, and it fills
        # them in as LITERALS — so the plist said 1.0 and 7 while
        # MARKETING_VERSION said 0.1.0 and the archive was passing
        # CURRENT_PROJECT_VERSION=48 on the command line. A build setting cannot
        # override a value that was already baked into the plist, so the
        # override did nothing and said nothing.
        #
        # Referencing the settings makes the command-line override work, which
        # is what the CI build number depends on: App Store Connect refuses a
        # build number it has already seen, and every upload was going to claim
        # to be the same one.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # THE SCHEME THE OAUTH CALLBACK RETURNS TO.
        #
        # A person taps Connect, leaves for GitHub, authorizes, and would
        # otherwise land on a page telling them to close a tab — a return they
        # have to notice and perform. The coordinator's callback redirects here
        # instead, and the app refreshes the screen they left.
        #
        # NOT a universal link: those need a domain association file and an
        # apex the app is verified for, which is real setup for a self-hoster.
        # A custom scheme is unverified and therefore not a place to send
        # anything secret — which is why it carries only `provider` and `ok`,
        # and the credential never leaves the coordinator's own request.
        CFBundleURLTypes:
          - CFBundleURLName: network.thetech.fleetwright
            CFBundleURLSchemes:
              - fleetwright
        # Answers export compliance in the bundle instead of per build in App
        # Store Connect. Without it every upload lands in "Missing Compliance"
        # and cannot go to testers until somebody clicks through the same two
        # questions — which defeats automatic distribution to an internal
        # group, since the build sits there looking delivered.
        #
        # false is the correct answer, not the convenient one: the app uses
        # HTTPS via URLSession and nothing else. That is exempt. An app that
        # implemented its own crypto, or used non-exempt algorithms, would have
        # to say true and file the documentation.
        ITSAppUsesNonExemptEncryption: false
        # App Store Connect rejects a bundle with no orientations declared —
        # error 90474, "no orientations were specified", raised in the name of
        # iPad multitasking. Upside-down is omitted on iPhone because iOS
        # ignores it there anyway; iPad gets all four, which is what
        # multitasking actually requires.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Remote notifications are the entire reason for the app over a
        # Shortcut: a Shortcut cannot tell you a session is waiting.
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.thetech.fleetwright
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Names the app icon in Assets.xcassets. Setting it is also what makes
        # Xcode write CFBundleIconName into the Info.plist, which App Store
        # Connect requires (error 90713) and which cannot be supplied by hand —
        # the value has to match a compiled asset catalog, not a file path.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # APNs has two environments and they do not share tokens. A build must
        # declare the one its provisioning profile was issued for, or signing
        # fails; and a TestFlight build declaring `development` installs fine
        # and then never receives a notification, because its token belongs to
        # a sandbox nothing is sending to.
        #
        # Archive builds Release, Xcode runs Debug, so this follows the build
        # rather than needing anyone to remember.
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    entitlements:
      # Generated and gitignored for the same reason as Info.plist above.
      path: Fleetwright/Fleetwright.entitlements
      properties:
        # Expanded from the build setting above, not hardcoded. A literal
        # `development` here is the classic "notifications work in Xcode and
        # not in TestFlight" — and it is worse than it sounds, because nothing
        # reports it: the upload succeeds, the build installs, and push is
        # simply silent.
        aps-environment: $(APS_ENVIRONMENT)
        # Sign in with Apple. The app has no accounts of its own: it hands the
        # coordinator an Apple ID token and gets a per-device credential back,
        # so this entitlement is the whole of the sign-in mechanism.
        #
        # OPERATIONAL NOTE, because it fails at SIGNING rather than at build:
        # the App ID has to have the Sign In with Apple capability enabled in
        # the developer portal, and the provisioning profile has to postdate
        # that. Cloud signing regenerates the profile, so enabling the
        # capability is the only manual step — but until it is done, archiving
        # fails with "provisioning profile does not include the
        # com.apple.developer.applesignin entitlement", which reads like a
        # certificate problem and is not one.
        com.apple.developer.applesignin:
          - Default
