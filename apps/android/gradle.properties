# --enable-native-access=ALL-UNNAMED silences a JDK 25 warning that is really a
# deprecation notice with a deadline:
#
#   WARNING: java.lang.System::load has been called by
#            net.rubygrapefruit.platform.internal.NativeLibraryLoader
#   WARNING: Restricted methods will be blocked in a future release unless
#            native access is enabled
#
# Gradle's own native-platform library is the caller, so there is nothing to fix
# in this project — but "blocked in a future release" means the build stops
# working on some later JDK unless the flag is there. Cheaper to set now than to
# diagnose the day it turns into an error.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

android.useAndroidX=true
kotlin.code.style=official
# The build does not need the full R8 pipeline for a debug APK, and turning it
# off keeps a first build on a fresh machine to something under a coffee.
android.nonTransitiveRClass=true
