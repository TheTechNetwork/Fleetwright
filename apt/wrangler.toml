# The apt repository: https://apt.thetech.network
#
# A WORKER, NOT PAGES, and not only for the logs. A deb is ~29 MB and both
# Pages and Workers static assets cap a file at 25 MiB, so the packages cannot
# be assets. The signed metadata is (InRelease, Packages, the key); a package is
# streamed by src/index.js — from Cloudflare's cache, or once per data centre
# from the GitHub release asset it was built into. apt checks every deb against
# the sha256 in the signed Packages file, so WHERE the bytes come from is not
# part of the trust — only the signature is.
#
# `public/` is generated by .github/workflows/apt-repo.yml on every publish and
# is not committed: it is the output of tools/build-apt-repo.sh.
#
# Its own Worker, not a route on the coordinator: the coordinator is per
# deployment (every fork runs its own), and the package repository is one thing
# for the whole project.
name = "fleetwright-apt"
main = "src/index.js"
compatibility_date = "2026-01-15"

routes = [
  { pattern = "apt.thetech.network", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
# THROUGH THE WORKER, or there is no log. An asset that exists is otherwise
# served before the Worker runs, so `apt update` fetching InRelease would never
# reach src/index.js and the "every update is a log line" promise would be
# false — it was, for one commit. The pool and the front page reach the Worker
# regardless (no such assets); dists/ is the one prefix that needs saying.
run_worker_first = ["/dists/*"]

[vars]
# Where a package comes from on a cache miss: this repository's releases.
GITHUB_REPOSITORY = "TheTechNetwork/Fleetwright"

# The point of putting it here rather than on GitHub Pages: every apt update
# and every download is a log line, and a repository that suddenly serves
# nothing, or serves one box a thousand times, is visible.
[observability]
enabled = true
