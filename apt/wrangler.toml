# The apt repository: https://apt.thetech.network
#
# A WORKER, NOT PAGES, and not only for the logs. A deb is ~29 MB and both
# Pages and Workers static assets cap a file at 25 MiB, so the packages cannot
# live here. They do not need to. The signed metadata does (InRelease, Packages,
# the key), and a request for a package is answered with a redirect to the
# GitHub release asset it was built into. apt follows redirects and checks every
# deb against the sha256 in the signed Packages file, so WHERE the bytes come
# from is not part of the trust — only the signature is.
#
# `public/` is generated by .github/workflows/apt-repo.yml on every publish and
# is not committed: it is the output of tools/build-apt-repo.sh.
#
# Its own Worker, not a route on the coordinator: the coordinator is per
# deployment (every fork runs its own), and the package repository is one thing
# for the whole project.
name = "fleetwright-apt"
main = "src/index.js"
compatibility_date = "2026-01-15"

routes = [
  { pattern = "apt.thetech.network", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
# Metadata that exists is served straight from the edge; anything else — the
# pool, and the front page — reaches the Worker.
not_found_handling = "none"

[vars]
# Where a package request is redirected: this repository's releases.
GITHUB_REPOSITORY = "TheTechNetwork/Fleetwright"

# The point of putting it here rather than on GitHub Pages: every apt update
# and every download is a log line, and a repository that suddenly serves
# nothing, or serves one box a thousand times, is visible.
[observability]
enabled = true
