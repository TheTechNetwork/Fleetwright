# Dev environment, pinned.
#
#   curl https://mise.run | sh     # once
#   mise install                   # in this directory
#
# This is for DEVELOPING agent-fleet. It is deliberately not what a deployment
# uses: install/install.sh finds or installs a system node precisely because a
# service must not depend on a version manager living in somebody's home
# directory. That distinction is the whole of the nvm bug this project already
# hit once — the operator's shell and the systemd unit want different things,
# and they are allowed to differ.

[tools]
# What CI runs. Anything from 18 up works at runtime — package.json's engines
# floor is a claim about the code, not about the machine building it.
node = "26"

# For the Android app. AGP 9 and Gradle 9.7 both run on 25, which is verified —
# the whole stack was built on it before this line was written.
java = "temurin-25"

[env]
# JDK 25 warns that Gradle's native-platform library calls a restricted method,
# and says it will be BLOCKED in a future release. The daemon gets this from
# gradle.properties; the launcher process that forks it needs it here.
GRADLE_OPTS = "--enable-native-access=ALL-UNNAMED"

# The Android SDK is NOT managed here. mise can install it through an asdf
# plugin, but the licence acceptance and the package set are the sort of thing
# that should be visible in a script rather than implied by a version string —
# see `mise run android-sdk` below.
ANDROID_HOME = "{{env.ANDROID_HOME | default(value='/opt/android-sdk')}}"

[tasks.test]
description = "Run every test"
run = "npm test"

[tasks.typecheck]
description = "Type-check the JSDoc annotations"
run = "npm run typecheck"

[tasks.check]
description = "What CI runs"
depends = ["test", "typecheck"]
run = "bash -n install/install.sh"

[tasks.hub]
description = "Run the session manager"
run = "node src/index.js"

[tasks.coordinator]
description = "Run the coordinator locally"
run = "node bin/agent-fleet-coordinator"

[tasks.sidecar]
description = "Check this box can drive its agent-hub"
run = "node bin/agent-fleet-sidecar doctor"

[tasks.android-sdk]
description = "Install the Android SDK pieces the app needs"
run = """
set -e
: "${ANDROID_HOME:=/opt/android-sdk}"
mkdir -p "$ANDROID_HOME/cmdline-tools"
if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
  curl -fsSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
  unzip -q -o /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
  mv -f "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
fi
export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
yes | sdkmanager --licenses >/dev/null
sdkmanager --install "platform-tools" "platforms;android-37.1" "build-tools;37.0.0"
echo "Android SDK ready at $ANDROID_HOME"
"""

[tasks.apk]
description = "Build the Android debug APK"
dir = "apps/android"
run = "./gradlew assembleDebug"

[tasks.worker-deploy]
description = "Deploy the coordinator to Cloudflare"
dir = "worker"
run = "npx wrangler deploy"
