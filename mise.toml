# Dev environment, pinned.
#
#   curl https://mise.run | sh     # once
#   mise install                   # in this directory
#
# This is for DEVELOPING agent-fleet. It is deliberately not what a deployment
# uses: install/install.sh finds or installs a system node precisely because a
# service must not depend on a version manager living in somebody's home
# directory. That distinction is the whole of the nvm bug this project already
# hit once — the operator's shell and the systemd unit want different things,
# and they are allowed to differ.

[tools]
# Current, not the floor. package.json declares >=24 and CI tests BOTH ends of
# that — 24 because it is what the floor claims, 26 because it is what anyone
# developing is actually on. Pinning the dev environment to the floor would mean
# nobody exercises the newer runtime until it breaks in CI.
node = "26"

# For the Android app. AGP 9 and Gradle 9.7 both run on 25, which is verified —
# the whole stack was built on it before this line was written.
java = "temurin-25.0.4+101.0.LTS"

[env]
# JDK 25 warns that Gradle's native-platform library calls a restricted method,
# and says it will be BLOCKED in a future release. The daemon gets this from
# gradle.properties; the launcher process that forks it needs it here.
GRADLE_OPTS = "--enable-native-access=ALL-UNNAMED"

# The Android SDK is NOT managed here. mise can install it through an asdf
# plugin, but the licence acceptance and the package set are the sort of thing
# that should be visible in a script rather than implied by a version string —
# see `mise run android-sdk` below.
ANDROID_HOME = "{{env.ANDROID_HOME | default(value='/opt/android-sdk')}}"

[tasks.test]
description = "Run every test"
run = "npm test"

[tasks.typecheck]
description = "Type-check the JSDoc annotations"
run = "npm run typecheck"

[tasks.check]
description = "What CI runs"
depends = ["test", "typecheck"]
run = "bash -n install/install.sh"

[tasks.hub]
description = "Run the session manager"
run = "node src/index.js"

[tasks.coordinator]
description = "Run the coordinator locally"
run = "node bin/agent-fleet-coordinator"

[tasks.sidecar]
description = "Check this box can drive its agent-hub"
run = "node bin/agent-fleet-sidecar doctor"

[tasks.android-sdk]
description = "Install the Android SDK pieces the app needs"
run = """
set -e
: "${ANDROID_HOME:=/opt/android-sdk}"
mkdir -p "$ANDROID_HOME/cmdline-tools"
if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
  curl -fsSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
  unzip -q -o /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
  mv -f "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
fi
export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
yes | sdkmanager --licenses >/dev/null
sdkmanager --install "platform-tools" "platforms;android-37.1" "build-tools;37.0.0"
echo "Android SDK ready at $ANDROID_HOME"
"""

[tasks.keystore]
description = "Generate the Android release signing key"
run = """
set -eu
# $HOME rather than $PWD: the deployed checkout is /opt/agent-fleet, which is
# root-owned, and a signing key does not belong in a git tree anyway.
out="${KEYSTORE_OUT:-$HOME/fleetwright-release.jks}"
alias_name="${KEY_ALIAS:-fleetwright}"

# Refusing to overwrite is the whole safety story here. An existing release.jks
# is the only copy of a key that Play ties to the listing forever; a second
# `mise run keystore` that clobbers it is unrecoverable, and the command that
# does it looks exactly like the one that worked.
if [ -e "$out" ]; then
  echo "$out already exists — refusing to overwrite it." >&2
  echo "A release key cannot be regenerated: Play identifies the app by it." >&2
  exit 1
fi

if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
  echo "Set KEYSTORE_PASSWORD (and optionally KEY_ALIAS, KEYSTORE_OUT)." >&2
  echo "  KEYSTORE_PASSWORD=... mise run keystore" >&2
  exit 2
fi

# -dname supplied so this never stops to ask; the fields are not verified by
# anyone and are visible in every APK.
keytool -genkeypair \
  -keystore "$out" -alias "$alias_name" \
  -keyalg RSA -keysize 4096 -validity 10000 \
  -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
  -dname "CN=Fleetwright, OU=Fleetwright, O=Fleetwright, C=US"

chmod 600 "$out"

echo
echo "Wrote $out"
echo
echo "GitHub -> Settings -> Secrets and variables -> Actions:"
echo "  ANDROID_KEYSTORE_BASE64    the line below"
echo "  ANDROID_KEYSTORE_PASSWORD  the password you just used"
echo "  ANDROID_KEY_ALIAS          $alias_name"
echo "  ANDROID_KEY_PASSWORD       the same password"
echo
base64 -w0 "$out"
echo
echo
echo "BACK UP $out SOMEWHERE ELSE. An Actions secret is write-only in the UI,"
echo "so it is not a backup, and losing this key means no updates to the"
echo "existing listing — only a new one."
"""

[tasks.apk]
description = "Build the Android debug APK"
dir = "apps/android"
run = "./gradlew assembleDebug"

[tasks.worker-deploy]
description = "Deploy the coordinator to Cloudflare"
dir = "worker"
run = "npx wrangler deploy"
