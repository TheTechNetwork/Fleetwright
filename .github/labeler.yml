# Which labels a pull request gets, from the files it changes.
#
# Read by .github/workflows/label.yml (actions/labeler). Two families, both
# already in the repository's label set: `platform/*` says WHERE a change
# lands, `area/*` says WHAT it is about. A PR usually gets one of the first
# and one or two of the second; a version bump touches a bit of everything
# and reads that way.
#
# EVERY TRACKED FILE MATCHES A `platform/*` RULE OR `area/ci` (the tooling
# is not a platform), and test/labeler.test.js fails a tree where one does not — a PR that changes something no rule names
# would otherwise arrive unlabelled, which is the same as "nobody looked". The
# `area/*` rules are narrower on purpose: an area a file does not belong to is
# noise, not coverage, and a file with no area is fine.
#
# `sync-labels` is on in the workflow, so a label follows the diff: a commit
# that takes the Android change out of a PR takes the label with it.

# --- where -----------------------------------------------------------------

platform/ios:
  - changed-files:
      - any-glob-to-any-file: ['apps/ios/**']

platform/android:
  - changed-files:
      - any-glob-to-any-file: ['apps/android/**']

# The Worker, the Node coordinator behind the tests, and the push path that
# only the coordinator sends on.
platform/coordinator:
  - changed-files:
      - any-glob-to-any-file:
          - 'worker/**'
          - 'src/fleet/coordinator/**'
          # The minting Worker's logic: it runs in its own Worker, beside the
          # coordinator's, and holds the GitHub App key.
          - 'src/fleet/minter/**'
          - 'src/fleet/push.js'
          - 'src/fleet/push-crypto.js'
          - 'src/fleet/crypto.js'
          - 'openapi.json'

# fleetwright and the sidecar, on a box: the hub, the host side of the fleet,
# the session image it runs, and everything that installs or updates it.
platform/host:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/index.js'
          - 'src/config.js'
          - 'src/log.js'
          - 'src/core/**'
          - 'src/adapters/**'
          - 'src/mcp/**'
          - 'src/web/**'
          - 'src/fleet/host/**'
          - 'src/fleet/protocol/**'
          - 'src/fleet/legacy-*.js'
          # Sealing a runner's repository token: runs on the runner and the
          # minting box; the coordinator only borrows its key pattern.
          - 'src/fleet/seal.js'
          - 'sandbox/**'
          - 'install/**'
          - 'apt/**'
          - 'archive/**'
          - '.dev.vars.example'

platform/cli:
  - changed-files:
      - any-glob-to-any-file: ['bin/**']

platform/docs:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '*.md', 'apps/*.md', 'LICENSE*']

