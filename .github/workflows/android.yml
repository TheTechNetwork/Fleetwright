name: Android

on:
  push:
    branches: [main]
    # Negative patterns after the positive ones, which is how GitHub resolves
    # them: last match wins. A README or a comment-only markdown file under
    # apps/android used to build, sign, upload and spend a build number to give
    # testers a byte-identical app.
    paths:
      - 'apps/android/**'
      # THE SHARED PARITY TABLE, which lives outside apps/ on purpose — it is
      # one file read by both phones and by the Node suite, and putting it under
      # either app would make it look like that app's.
      #
      # It has to be named here or this workflow does not run for the one change
      # the table exists to police. That is the identical failure #367 took out
      # of ci.yml: a filter skipping the tests that guard the files it skips for.
      # test/parity-fixtures.test.js fails if this line goes away.
      - 'test/fixtures/parity/**'
      - '.github/workflows/android.yml'
      - '!apps/android/**/*.md'
  pull_request:
    paths:
      - 'apps/android/**'
      # THE SHARED PARITY TABLE, which lives outside apps/ on purpose — it is
      # one file read by both phones and by the Node suite, and putting it under
      # either app would make it look like that app's.
      #
      # It has to be named here or this workflow does not run for the one change
      # the table exists to police. That is the identical failure #367 took out
      # of ci.yml: a filter skipping the tests that guard the files it skips for.
      # test/parity-fixtures.test.js fails if this line goes away.
      - 'test/fixtures/parity/**'
      - '.github/workflows/android.yml'
      - '!apps/android/**/*.md'
  workflow_dispatch:
  release:
    types: [published]

# One run per branch. Nothing here cancelled a superseded run before, so a
# branch pushed three times in a minute kept three builds alive and the answer
# you waited for was from the commit before last.
#
# PRs only, again: on main these jobs deploy the Worker, upload to TestFlight
# and attach a release APK. A cancelled PR run is waste; a cancelled main run
# is a thing that did not ship while reporting nothing wrong.
concurrency:
  # Deliberately NOT keyed by SHA, unlike ci.yml and codeql.yml. This workflow
  # ships something, and when two commits land close together the newest is the
  # one that should ship — so a shared group, where an older PENDING run is
  # dropped in favour of a newer one, is the behaviour we want rather than a
  # limitation to work around.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The floor. `release` raises its own to contents: write below, because
# attaching an APK to a release is a write to the repository — nothing else
# here is, and the debug job that runs on every pull request must not have it.
permissions:
  contents: read

# The Gradle LAUNCHER jvm needs this, not just the daemon — it loads Gradle's
# native-platform library before forking, and JDK 25 warns that
# "restricted methods will be blocked in a future release". org.gradle.jvmargs
# in gradle.properties covers the daemon; this covers the process that starts it.
env:
  GRADLE_OPTS: --enable-native-access=ALL-UNNAMED

jobs:
  # Every PR, no secrets. The APK is uploaded as an artifact, so a review can
  # end with installing the thing rather than reading about it.
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.1
        with:
          # Installed explicitly rather than left to AGP's auto-download, so a
          # missing platform fails here with an obvious message instead of
          # halfway through a Gradle task.
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6.3.0

      # THE UNIT TESTS, BEFORE THE BUILD, because a compile failure in a test
      # is cheaper to read on its own than buried after an APK.
      #
      # Plain JVM — no emulator, no device. Everything asserted here is a pure
      # function, so this costs seconds on the runner already set up above.
      #
      # It is not a no-op gate added in advance of tests existing: it runs
      # ReassuranceParityTest, which drives this app's reassurance rule against
      # the same table apps/ios runs its Swift against. Before this, the only
      # thing asserting the two phones agreed was a Node test grepping both
      # sources for a word — which passes whether they agree or not.
      - name: Unit tests
        working-directory: apps/android
        # AND THE COUNT IS CHECKED, because `testDebugUnitTest` passes when it
        # runs NOTHING. If the test source set is ever not picked up — a moved
        # directory, a renamed variant, a Gradle change — the task succeeds
        # having discovered no classes, and the job goes green having asserted
        # nothing at all. That is the exact shape of green this whole change
        # exists to remove, and it would be invisible in the log: Gradle's test
        # task is silent on success.
        #
        # Read out of the JUnit XML rather than Gradle's own output, because the
        # XML is a contract and console formatting is not.
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest
          results=app/build/test-results/testDebugUnitTest
          total=$(grep -ho 'tests="[0-9]*"' "$results"/*.xml 2>/dev/null \
            | tr -dc '0-9\n' | awk '{s+=$1} END {print s+0}')
          echo "JUnit XML reports $total test(s)"
          if [ "$total" -lt 1 ]; then
            echo "::error::testDebugUnitTest passed having run no tests — the test source set was not picked up"
            ls -R "$results" 2>&1 || true
            exit 1
          fi

      - name: Build the debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-fleet-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          # Long enough to still be there when somebody gets to the PR, short
          # enough not to accumulate.
          retention-days: 30

  # Signed, and only on a release. An unsigned release APK cannot be installed,
  # which makes producing one worse than useless.
  release:
    # Merging to main publishes. It did not, and a merge left this job SKIPPED
    # while the run stayed green — so "Android: success" on main meant a debug
    # APK was built and nothing shipped, which is the most expensive kind of
    # green there is.
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    outputs:
      # So the Play job can tell "built and signed" from "skipped for want of a
      # keystore". Both leave this job green.
      built: ${{ steps.keystore.outputs.have }}
    # `gh release upload` in the last step writes to the repository. This is the
    # only job in the repository that needs more than read.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.1
        with:
          # Installed explicitly rather than left to AGP's auto-download, so a
          # missing platform fails here with an obvious message instead of
          # halfway through a Gradle task.
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Check there is a keystore to sign with
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — skipping the signed build. See docs/ci.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the keystore
        if: steps.keystore.outputs.have == 'true'
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Outside the source tree and removed by the runner with the workspace.
        # A keystore committed by accident is a key you have to rotate.
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK and bundle
        if: steps.keystore.outputs.have == 'true'
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Play refuses a versionCode it has already seen, so this cannot be
          # the constant the Gradle file falls back to.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        # BOTH. The APK is what somebody sideloads from a GitHub release, and
        # Play will not accept it for a new app; the bundle is what Play wants
        # and is useless for sideloading.
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v7.0.1
        if: steps.keystore.outputs.have == 'true'
        with:
          name: agent-fleet-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # The bundle, for the job that publishes to Play. Kept separate from the
      # APK because they go to different places and only one of them is any use
      # to a person with a phone.
      - uses: actions/upload-artifact@v7.0.1
        if: steps.keystore.outputs.have == 'true'
        with:
          name: fleetwright-release-bundle
          path: apps/android/app/build/outputs/bundle/release/*.aab
          # error, not the default warn. This artifact was silently empty for a
          # whole release: the build step never ran bundleRelease, upload-artifact
          # shrugged, and the failure surfaced in a different job as "Artifact not
          # found" — which says nothing about the cause.
          if-no-files-found: error

      - name: Attach the APK to the release
        if: steps.keystore.outputs.have == 'true' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" apps/android/app/build/outputs/apk/release/*.apk --clobber

  # Play, on whichever track the event means.
  #
  #   push to main         PLAY_COMMIT_TRACK    default beta        — open testing
  #   prerelease published PLAY_COMMIT_TRACK    default beta        — testers, not everybody
  #   release published    PLAY_RELEASE_TRACK   default production  — everybody
  #
  # The difference that matters is who is on the other side. Open testing is
  # anybody who finds the Play listing and taps join; production is anybody who
  # finds the Play listing. That is a smaller gap than it sounds, and it is the
  # right one to put a RELEASE across rather than a merge: a merge happens
  # because a branch was ready, and "ready to merge" is not the same decision as
  # "ready for everybody who already has it installed".
  #
  # WHY NOT TAG PUSHES AS WELL. A GitHub release is made FROM a tag, so pushing
  # one fires both `push: tags` and `release: published` — two runs, two build
  # numbers, two production releases minutes apart, the second one silently
  # replacing the first. The release event is also the only one carrying notes,
  # and on production those notes are public. A bare tag with no release is not
  # a shipment; it is a bookmark.
  #
  # Both go through Google review, so neither is instant. On production that
  # slowness is the last chance to notice.
  #
  # Both are repository VARIABLES so moving a track is a setting rather than a
  # pull request:
  #
  #   gh variable set PLAY_COMMIT_TRACK --body alpha
  #   gh variable set PLAY_RELEASE_TRACK --body beta
  #
  # And PLAY_ROLLOUT stages a production release rather than shipping it whole:
  #
  #   gh variable set PLAY_ROLLOUT --body 0.1
  #
  # It is unset on purpose. A staged rollout has to be FINISHED by hand in the
  # console, and a default that leaves every release half-shipped by a pipeline
  # reporting success is worse than no staging at all.
  publish:
    name: publish to Play
    needs: release
    # Both events publish, and they publish to DIFFERENT TRACKS. That is what
    # makes them two shipments rather than one duplicate:
    #
    #   push to main       open testing  — anybody who found the listing and joined
    #   release published  production    — everybody
    #
    # workflow_dispatch stays on the COMMIT track, which matters more now that
    # the other one is production: dispatching by hand is a test of the
    # pipeline, and a pipeline test must not be the thing that ships to the
    # public. Nothing reaches production without somebody publishing a release
    # and writing what is in it.
    if: >-
      needs.release.outputs.built == 'true' &&
      (github.event_name == 'release' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: fleetwright-release-bundle
          path: bundle
      - name: Upload to Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE_NAME: network.thetech.fleetwright
          # The track follows the EVENT, which is the whole point of this job
          # running on two of them. A PRERELEASE stays on the commit track: the
          # box literally says "not ready for production", and it used to ship
          # to everybody anyway, because only the event name was consulted.
          # Same grammar as iOS now — prerelease means testers, full release
          # means the public.
          #
          # `a && b || c` is GitHub's ternary. It is safe here only because the
          # middle value cannot be falsy — both branches end in a non-empty
          # string literal, so a missing repository variable falls through to
          # the default rather than collapsing the expression. A bare
          # `vars.X` in the middle would silently select the wrong track the
          # day somebody cleared the variable.
          PLAY_TRACK: >-
            ${{ github.event_name == 'release' && !github.event.release.prerelease
                && (vars.PLAY_RELEASE_TRACK || 'production')
                || (vars.PLAY_COMMIT_TRACK || 'beta') }}
          # Empty means "all of it", which is the only sane default — see
          # rollout() in the tool. Only consulted on a production release,
          # which a prerelease is now not.
          PLAY_ROLLOUT: >-
            ${{ github.event_name == 'release' && !github.event.release.prerelease
                && vars.PLAY_ROLLOUT || '' }}
          # The last resort only. See the shell below: the notes come from
          # CHANGELOG.md, and this is what is used when that file has no
          # section for the version being built. Empty notes are accepted by
          # Play and tell a tester nothing, so there has to be something.
          FALLBACK_NOTES: ${{ github.event.release.body || github.event.release.name || github.event.head_commit.message }}
        run: |
          # PLAY REFUSES MORE THAN 500 CHARACTERS PER LOCALE, and refusing is
          # the good case — the bad one is a note cut mid-clause, which reads as
          # a bug in the app rather than as a shortened note. The extractor
          # trims at a paragraph boundary and says a fuller version exists.
          RELEASE_NOTES="$(node scripts/release-notes.mjs --max 500 2>/dev/null)" || true
          if [ -z "$RELEASE_NOTES" ]; then
            echo "::warning::CHANGELOG.md had no notes for this build — falling back to the release body."
            RELEASE_NOTES="$FALLBACK_NOTES"
          fi
          export RELEASE_NOTES
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set — skipping Play. See docs/ci.md."
            exit 0
          fi
          AAB_PATH="$(find bundle -name '*.aab' | head -1)" node tools/play-release.mjs
