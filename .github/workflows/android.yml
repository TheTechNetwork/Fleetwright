name: Android

on:
  push:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
  release:
    types: [published]

# One run per branch. Nothing here cancelled a superseded run before, so a
# branch pushed three times in a minute kept three builds alive and the answer
# you waited for was from the commit before last.
#
# PRs only, again: on main these jobs deploy the Worker, upload to TestFlight
# and attach a release APK. A cancelled PR run is waste; a cancelled main run
# is a thing that did not ship while reporting nothing wrong.
concurrency:
  # Deliberately NOT keyed by SHA, unlike ci.yml and codeql.yml. This workflow
  # ships something, and when two commits land close together the newest is the
  # one that should ship — so a shared group, where an older PENDING run is
  # dropped in favour of a newer one, is the behaviour we want rather than a
  # limitation to work around.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The floor. `release` raises its own to contents: write below, because
# attaching an APK to a release is a write to the repository — nothing else
# here is, and the debug job that runs on every pull request must not have it.
permissions:
  contents: read

# The Gradle LAUNCHER jvm needs this, not just the daemon — it loads Gradle's
# native-platform library before forking, and JDK 25 warns that
# "restricted methods will be blocked in a future release". org.gradle.jvmargs
# in gradle.properties covers the daemon; this covers the process that starts it.
env:
  GRADLE_OPTS: --enable-native-access=ALL-UNNAMED

jobs:
  # Every PR, no secrets. The APK is uploaded as an artifact, so a review can
  # end with installing the thing rather than reading about it.
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          # Installed explicitly rather than left to AGP's auto-download, so a
          # missing platform fails here with an obvious message instead of
          # halfway through a Gradle task.
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build the debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: agent-fleet-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          # Long enough to still be there when somebody gets to the PR, short
          # enough not to accumulate.
          retention-days: 30

  # Signed, and only on a release. An unsigned release APK cannot be installed,
  # which makes producing one worse than useless.
  release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      # So the Play job can tell "built and signed" from "skipped for want of a
      # keystore". Both leave this job green.
      built: ${{ steps.keystore.outputs.have }}
    # `gh release upload` in the last step writes to the repository. This is the
    # only job in the repository that needs more than read.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          # Installed explicitly rather than left to AGP's auto-download, so a
          # missing platform fails here with an obvious message instead of
          # halfway through a Gradle task.
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6

      - name: Check there is a keystore to sign with
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — skipping the signed build. See docs/ci.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the keystore
        if: steps.keystore.outputs.have == 'true'
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Outside the source tree and removed by the runner with the workspace.
        # A keystore committed by accident is a key you have to rotate.
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        if: steps.keystore.outputs.have == 'true'
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v7
        if: steps.keystore.outputs.have == 'true'
        with:
          name: agent-fleet-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk

      # The bundle, for the job that publishes to Play. Kept separate from the
      # APK because they go to different places and only one of them is any use
      # to a person with a phone.
      - uses: actions/upload-artifact@v7
        if: steps.keystore.outputs.have == 'true'
        with:
          name: fleetwright-release-bundle
          path: apps/android/app/build/outputs/bundle/release/*.aab

      - name: Attach the APK to the release
        if: steps.keystore.outputs.have == 'true' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" apps/android/app/build/outputs/apk/release/*.apk --clobber

  # Play's internal testing track: up to 100 testers, no review, live in
  # minutes. The counterpart to TestFlight internal in ios.yml, and triggered
  # the same way — on a release rather than every commit, because an Android
  # release here is a signed artifact somebody chose to cut.
  internal:
    name: publish to the internal track
    needs: release
    if: github.event_name == 'release' && needs.release.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: fleetwright-release-bundle
          path: bundle
      - name: Upload to the internal track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE_NAME: network.thetech.fleetwright
          PLAY_TRACK: internal
          RELEASE_NOTES: ${{ github.event.release.body || github.event.release.name }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set — skipping Play. See docs/ci.md."
            exit 0
          fi
          AAB_PATH="$(find bundle -name '*.aab' | head -1)" node tools/play-internal-release.mjs
