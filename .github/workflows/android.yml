name: Android

on:
  push:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
  release:
    types: [published]

jobs:
  # Every PR, no secrets. The APK is uploaded as an artifact, so a review can
  # end with installing the thing rather than reading about it.
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # Installed explicitly rather than left to AGP's auto-download, so a
          # missing platform fails here with an obvious message instead of
          # halfway through a Gradle task.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: agent-fleet-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          # Long enough to still be there when somebody gets to the PR, short
          # enough not to accumulate.
          retention-days: 30

  # Signed, and only on a release. An unsigned release APK cannot be installed,
  # which makes producing one worse than useless.
  release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # Installed explicitly rather than left to AGP's auto-download, so a
          # missing platform fails here with an obvious message instead of
          # halfway through a Gradle task.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Check there is a keystore to sign with
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — skipping the signed build. See docs/ci.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the keystore
        if: steps.keystore.outputs.have == 'true'
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Outside the source tree and removed by the runner with the workspace.
        # A keystore committed by accident is a key you have to rotate.
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        if: steps.keystore.outputs.have == 'true'
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.have == 'true'
        with:
          name: agent-fleet-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk

      - name: Attach the APK to the release
        if: steps.keystore.outputs.have == 'true' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" apps/android/app/build/outputs/apk/release/*.apk --clobber
