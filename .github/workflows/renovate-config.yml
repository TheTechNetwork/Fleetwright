name: Renovate config

# Only when the config it validates changes.
#
# It ran on every push and every pull request, and spent about forty seconds of
# each one downloading renovate@latest to check a file that had not moved in
# weeks. A check that cannot fail is not telling you anything; it is just
# something to wait for.
#
# A paths filter rather than a job-level `if`, which is the opposite of the
# choice made in codeql.yml — and for a reason. There, skipping is invisible
# and a code-scanning run reporting no status looks like one that was never
# written. Here the job is a lint on one file: no status on a pull request that
# does not touch renovate.json is the correct amount to say.
on:
  push:
    branches: [main]
    paths: ['renovate.json', '.github/workflows/renovate-config.yml']
  pull_request:
    paths: ['renovate.json', '.github/workflows/renovate-config.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  renovate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'

      # NO FILE ARGUMENT, deliberately. Given a path, the validator treats the
      # file as SELF-HOSTED GLOBAL config, which is a different schema — it
      # accepts options a repository config must reject. Proven with
      # binarySource, which a repo config refuses ("a global option reserved
      # only for Renovate's global configuration") and a global config merely
      # deprecates. With no argument it finds renovate.json itself and checks it
      # as what it actually is.
      #
      # --strict so a warning or a pending config migration fails too. The
      # failure this whole job exists for was a config Renovate REJECTED rather
      # than one that was wrong, and that never announces itself.
      #
      # @latest, and the version is printed: the hosted bot runs a recent
      # Renovate, and `npx --package renovate` without a tag will reuse whatever
      # happens to be in the npx cache.
      - name: Renovate config is valid
        run: |
          npx --yes --package renovate@latest -- renovate-config-validator --version
          npx --yes --package renovate@latest -- renovate-config-validator --strict
