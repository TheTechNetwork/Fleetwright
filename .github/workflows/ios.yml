name: iOS

on:
  # Internal TestFlight on every commit to main THAT AFFECTS THE APP. The
  # filter stays: a commit touching only the coordinator or the docs produces
  # a byte-identical binary, so uploading it spends a macOS build and a build
  # number to give testers the same app twice.
  push:
    branches: [main]
    # Negative patterns after the positive ones, which is how GitHub resolves
    # them: last match wins. A README or a comment-only markdown file under
    # apps/ios used to build, sign, upload and spend a build number to give
    # testers a byte-identical app.
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
      - '!apps/ios/**/*.md'
  pull_request:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
      - '!apps/ios/**/*.md'
  workflow_dispatch:
  release:
    types: [published]

# One run per branch. Nothing here cancelled a superseded run before, so a
# branch pushed three times in a minute kept three builds alive and the answer
# you waited for was from the commit before last.
#
# PRs only, again: on main these jobs deploy the Worker, upload to TestFlight
# and attach a release APK. A cancelled PR run is waste; a cancelled main run
# is a thing that did not ship while reporting nothing wrong.
concurrency:
  # Deliberately NOT keyed by SHA, unlike ci.yml and codeql.yml. This workflow
  # ships something, and when two commits land close together the newest is the
  # one that should ship — so a shared group, where an older PENDING run is
  # dropped in favour of a newer one, is the behaviour we want rather than a
  # limitation to work around.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Neither job touches the GitHub API — the build uploads nothing and TestFlight
# uploads to App Store Connect with its own API key. Read is all either needs.
permissions:
  contents: read

jobs:
  # THE IMPORTANT ONE. design.md §9 says the iOS app cannot be built in the
  # environment it was written in — no macOS, no Xcode — so until now it has
  # been reviewed code rather than verified code. This compiles it.
  #
  # No secrets and no signing: CODE_SIGNING_ALLOWED=NO builds for the simulator,
  # which type-checks every line without needing a team, a certificate or a
  # provisioning profile. Signing problems are a separate class of failure and
  # should not be able to hide a syntax error.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        # Skip brew's formula-index refresh, which regularly costs more than
        # the install it precedes.
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/ios
        # project.yml is the source of truth; the .xcodeproj is generated and
        # gitignored, because a hand-written pbxproj opens on exactly one machine.
        run: xcodegen generate

      - name: Build
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Fleetwright.xcodeproj \
            -scheme Fleetwright \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || xcodebuild build \
              -project Fleetwright.xcodeproj \
              -scheme Fleetwright \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO

  # TestFlight. Runs on a published release, and skips itself rather than
  # failing when the App Store Connect credentials are not set up yet.
  testflight:
    # Every merge to main goes to TestFlight internal. The previous condition
    # was release-or-manual, and since no release has ever been published and
    # nobody has dispatched it by hand, this job had never run once — the app
    # was building on every PR and reaching nobody.
    #
    # Internal testers do not need review, so this costs a build and nothing
    # else. External testing still wants a release, which is the right place
    # for a decision.
    if: >-
      github.event_name == 'release' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: macos-latest
    environment: production
    outputs:
      # So the job that hands the build to testers can tell "uploaded" from
      # "skipped for want of a key". Both leave this job green.
      uploaded: ${{ steps.creds.outputs.have }}
    steps:
      - uses: actions/checkout@v7

      - name: Check there are credentials to upload with
        id: creds
        env:
          KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::APPSTORE_PRIVATE_KEY is not set — skipping TestFlight. See docs/ci.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        if: steps.creds.outputs.have == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install xcodegen

      - name: Install the App Store Connect API key
        if: steps.creds.outputs.have == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        # An API key rather than certificates in the repo: it is one secret,
        # it is revocable from the web, and it lets xcodebuild create the
        # signing assets itself with -allowProvisioningUpdates. Fastlane match
        # solves the same problem by giving you a second repository of secrets
        # to look after.
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Generate the Xcode project
        if: steps.creds.outputs.have == 'true'
        working-directory: apps/ios
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodegen generate
          # The team cannot live in project.yml — it is account-specific, and
          # anybody generating the project locally has their own.
          /usr/libexec/PlistBuddy -c "Print" Fleetwright.xcodeproj/project.pbxproj >/dev/null 2>&1 || true

      # The signing identity, imported rather than minted.
      #
      # -allowProvisioningUpdates creates a distribution certificate when it
      # cannot find one, and a CI runner is a fresh machine with an empty
      # keychain every time — so every release asked Apple for a new
      # certificate until the account hit its cap and archiving failed with
      # "Choose a certificate to revoke". The certificates it made were also
      # useless: their private keys lived on runners that no longer exist.
      #
      # One certificate, exported once, imported here. The API key still
      # handles the upload; only the identity stops being disposable.
      - name: Import the signing certificate
        if: steps.creds.outputs.have == 'true'
        env:
          P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ]; then
            echo "::warning::APPLE_DISTRIBUTION_P12 is not set — falling back to cloud signing, which mints a certificate per run."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # A throwaway keychain with a throwaway password: it lives for one
          # job on a machine that is destroyed afterwards, so the password
          # protects nothing and only has to exist.
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          printf '%s' "$P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          # -A would let ANY tool use the key without prompting. Limited to the
          # two that need it instead, which costs nothing here and is the sort
          # of default worth not copying from a blog post.
          # The failure this catches is not the one it names. macOS cannot read a
          # PKCS#12 written with OpenSSL 3's defaults — MAC sha256, AES-256-CBC —
          # and reports it as "MAC verification failed (wrong password?)", which
          # sends people to check a password that was always right.
          if ! security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
               -T /usr/bin/codesign -T /usr/bin/security 2>"$RUNNER_TEMP/import.err"; then
            cat "$RUNNER_TEMP/import.err"
            if grep -qi 'MAC verification failed' "$RUNNER_TEMP/import.err"; then
              echo "::error::Most likely the .p12 was exported with OpenSSL 3 defaults, which macOS cannot read."
              echo "Re-export the SAME key and certificate with -legacy, and check it says MAC: sha1:"
              echo "  openssl pkcs12 -export -legacy -inkey distribution.key -in distribution.pem -out distribution.p12"
              echo "  openssl pkcs12 -in distribution.p12 -info -nokeys -passin pass:... 2>&1 | grep MAC:"
              echo "If it already says sha1, check APPLE_DISTRIBUTION_P12_PASSWORD for a trailing newline —"
              echo "piping a file or an echo into a secret includes one, and it fails the same way."
            fi
            exit 1
          fi
          # Without this, codesign stops on a GUI prompt nobody can answer and
          # the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" >/dev/null
          # Prepended, not replaced: the system keychain still has to be
          # searchable for the Apple root certificates.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "imported $(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c 'Apple Distribution' || true) distribution identity"

      - name: Archive
        if: steps.creds.outputs.have == 'true'
        working-directory: apps/ios
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # App Store Connect refuses a build number it has already seen for a
          # given version, so project.yml's CURRENT_PROJECT_VERSION of "1"
          # would have allowed exactly one upload ever. run_number only
          # increases.
          BUILD_NUMBER: ${{ github.run_number }}
        # If this fails with "provisioning profile does not include the
        # com.apple.developer.applesignin entitlement", it is not a certificate
        # problem however much it reads like one. The app entitles Sign in with
        # Apple — that is the whole of how the app authenticates — and the App
        # ID has to carry the capability before a profile can include it.
        # -allowProvisioningUpdates with an API key usually enables it for you;
        # when it does not, it is one checkbox in the developer portal under
        # Identifiers -> network.thetech.fleetwright.
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Fleetwright.xcodeproj \
            -scheme Fleetwright \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Fleetwright.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to TestFlight
        if: steps.creds.outputs.have == 'true'
        working-directory: apps/ios
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Fleetwright.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

  # An upload is not a delivery. A build processes for anywhere between two
  # minutes and half an hour and then sits in App Store Connect until something
  # puts it in front of somebody.
  #
  # App Store Connect has a checkbox for this — "automatic distribution" on an
  # internal group — and it works. This does the same thing in a file that can
  # be reviewed, and that does not quietly stop applying when a group is
  # renamed or recreated.
  #
  # ubuntu, not macOS: it is one JWT and some HTTP, and holding a macOS runner
  # open for twenty minutes of polling would cost ten times as much for nothing.
      # always(), because the interesting case is the failed run: a keychain
      # left behind on a hosted runner is destroyed with the machine, but this
      # job is the only place that would ever hold a signing identity, and
      # "tidied up except when something went wrong" is not tidying up.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  distribute:
    name: distribute to internal testers
    needs: testflight
    if: needs.testflight.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    environment: production
    # App Store Connect's automatic distribution is now on for the internal
    # group, so assignment happens whether this job runs or not. What is left
    # here is "What to Test", which the checkbox cannot set — a nicety, and a
    # nicety must not be able to redden a run whose upload succeeded.
    #
    # The first automated note was refused for containing the robot emoji from
    # this project's own commit footer. That is exactly the class of failure
    # that should be a warning: the build is fine, the testers have it, and the
    # notes are missing a line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Assign the build to the internal group
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          BUNDLE_ID: network.thetech.fleetwright
          # The same number the archive stamped, which is how the build is
          # found again — App Store Connect calls it "version" on a build,
          # confusingly.
          BUILD_NUMBER: ${{ github.run_number }}
          AUDIENCE: internal
          # Optional. Unset means the first internal group, which is right
          # while there is exactly one.
          INTERNAL_BETA_GROUP_NAME: ${{ vars.INTERNAL_BETA_GROUP_NAME }}
          # The commit is the honest answer to "what changed" for an internal
          # build that ships on every commit.
          WHATS_NEW: ${{ github.event.head_commit.message || github.sha }}
        run: node tools/testflight-distribute.mjs

  # External testers are the public, so this is NOT every commit on main. A
  # published release is a decision somebody made, which is the right shape for
  # a delivery that Apple reviews and that real people install.
  distribute-external:
    name: distribute to external testers
    needs: testflight
    if: github.event_name == 'release' && needs.testflight.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Assign the build to the external group and submit it for review
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          BUNDLE_ID: network.thetech.fleetwright
          BUILD_NUMBER: ${{ github.run_number }}
          AUDIENCE: external
          EXTERNAL_BETA_GROUP_NAME: ${{ vars.EXTERNAL_BETA_GROUP_NAME }}
          # The release notes, which is what somebody actually wrote for the
          # people who will read it.
          WHATS_NEW: ${{ github.event.release.body || github.event.release.name }}
        run: node tools/testflight-distribute.mjs
