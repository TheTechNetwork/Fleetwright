name: iOS

on:
  # Internal TestFlight on every commit to main THAT AFFECTS THE APP. The
  # filter stays: a commit touching only the coordinator or the docs produces
  # a byte-identical binary, so uploading it spends a macOS build and a build
  # number to give testers the same app twice.
  push:
    branches: [main]
    # Negative patterns after the positive ones, which is how GitHub resolves
    # them: last match wins. A README or a comment-only markdown file under
    # apps/ios used to build, sign, upload and spend a build number to give
    # testers a byte-identical app.
    paths:
      - 'apps/ios/**'
      # THE SHARED PARITY TABLE, which lives outside apps/ on purpose — it is
      # one file read by both phones and by the Node suite, and putting it under
      # either app would make it look like that app's.
      #
      # It has to be named here or this workflow does not run for the one change
      # the table exists to police. That is the identical failure #367 took out
      # of ci.yml: a filter skipping the tests that guard the files it skips for.
      # test/parity-fixtures.test.js fails if this line goes away.
      - 'test/fixtures/parity/**'
      - '.github/workflows/ios.yml'
      - '!apps/ios/**/*.md'
  pull_request:
    paths:
      - 'apps/ios/**'
      # THE SHARED PARITY TABLE, which lives outside apps/ on purpose — it is
      # one file read by both phones and by the Node suite, and putting it under
      # either app would make it look like that app's.
      #
      # It has to be named here or this workflow does not run for the one change
      # the table exists to police. That is the identical failure #367 took out
      # of ci.yml: a filter skipping the tests that guard the files it skips for.
      # test/parity-fixtures.test.js fails if this line goes away.
      - 'test/fixtures/parity/**'
      - '.github/workflows/ios.yml'
      - '!apps/ios/**/*.md'
  workflow_dispatch:
  release:
    types: [published]

# One run per branch. Nothing here cancelled a superseded run before, so a
# branch pushed three times in a minute kept three builds alive and the answer
# you waited for was from the commit before last.
#
# PRs only, again: on main these jobs deploy the Worker, upload to TestFlight
# and attach a release APK. A cancelled PR run is waste; a cancelled main run
# is a thing that did not ship while reporting nothing wrong.
concurrency:
  # Deliberately NOT keyed by SHA, unlike ci.yml and codeql.yml. This workflow
  # ships something, and when two commits land close together the newest is the
  # one that should ship — so a shared group, where an older PENDING run is
  # dropped in favour of a newer one, is the behaviour we want rather than a
  # limitation to work around.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Neither job touches the GitHub API — the build uploads nothing and TestFlight
# uploads to App Store Connect with its own API key. Read is all either needs.
permissions:
  contents: read

jobs:
  # THE IMPORTANT ONE. design.md §9 says the iOS app cannot be built in the
  # environment it was written in — no macOS, no Xcode — so until now it has
  # been reviewed code rather than verified code. This compiles it.
  #
  # No secrets and no signing: CODE_SIGNING_ALLOWED=NO builds for the simulator,
  # which type-checks every line without needing a team, a certificate or a
  # provisioning profile. Signing problems are a separate class of failure and
  # should not be able to hide a syntax error.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install XcodeGen
        # Skip brew's formula-index refresh, which regularly costs more than
        # the install it precedes.
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          # UNTAP RATHER THAN SILENCE. GitHub's macOS image ships aws/tap
          # tapped, Homebrew now requires tap trust, and every brew command
          # prints a paragraph about it. We use brew for one formula and never
          # touch aws/tap, so removing it is the honest fix.
          #
          # NOT HOMEBREW_NO_REQUIRE_TAP_TRUST=1, which turns off the check for
          # every tap including ones we do use — and which Homebrew says it
          # will remove. Silencing a security warning by disabling the security
          # is the trade this repository keeps declining.
          #
          # `|| true` because a future image may not ship it, and a missing tap
          # must not fail a build.
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/ios
        # project.yml is the source of truth; the .xcodeproj is generated and
        # gitignored, because a hand-written pbxproj opens on exactly one machine.
        run: xcodegen generate

      - name: Build
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Fleetwright.xcodeproj \
            -scheme Fleetwright \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || xcodebuild build \
              -project Fleetwright.xcodeproj \
              -scheme Fleetwright \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO

      # THE UNIT TESTS, on a real simulator.
      #
      # Separate from the build above, and the destination is why: `xcodebuild
      # build` uses `generic/platform=iOS Simulator`, which compiles for any
      # simulator and needs none to exist. `xcodebuild test` CANNOT use a
      # generic destination — it has to boot something — so this is a different
      # invocation rather than a flag on the same one.
      #
      # THE DEVICE IS CHOSEN AT RUN TIME. A hardcoded `name=iPhone 17` is a job
      # that breaks when the runner image changes its device set, which happens
      # without warning and looks like a code failure. This asks the runner what
      # it has and fails loudly if the answer is nothing.
      - name: Unit tests
        working-directory: apps/ios
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available --json | jq -r '
            [ .devices
              | to_entries[]
              | select(.key | test("iOS"))
              | .value[]
              | select(.name | startswith("iPhone"))
              | .udid
            ] | first // empty')
          if [ -z "$device" ]; then
            echo "::error::no iOS iPhone simulator is available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "testing on simulator $device"
          xcodebuild test \
            -project Fleetwright.xcodeproj \
            -scheme Fleetwright \
            -sdk iphonesimulator \
            -destination "id=$device" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

  # TestFlight. Runs on a published release, and skips itself rather than
  # failing when the App Store Connect credentials are not set up yet.
  testflight:
    # Every merge to main goes to TestFlight internal. The previous condition
    # was release-or-manual, and since no release has ever been published and
    # nobody has dispatched it by hand, this job had never run once — the app
    # was building on every PR and reaching nobody.
    #
    # Internal testers do not need review, so this costs a build and nothing
    # else. External testing still wants a release, which is the right place
    # for a decision.
    if: >-
      github.event_name == 'release' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: macos-latest
    environment: production
    outputs:
      # So the job that hands the build to testers can tell "uploaded" from
      # "skipped for want of a key". Both leave this job green.
      uploaded: ${{ steps.creds.outputs.have }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check there are credentials to upload with
        id: creds
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
          P12: ${{ secrets.APPLE_DIST_P12 }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          # ALL THREE, or skip. This used to check only the API key, and the
          # other two were treated as optional with a fallback to automatic
          # signing — which is what burned a certificate per run until the
          # account hit its cap. Skipping costs a release; minting costs the
          # ability to release at all, and takes a trip to the developer portal
          # to undo.
          missing=""
          [ -z "$KEY" ] && missing="$missing ASC_KEY_P8"
          [ -z "$P12" ] && missing="$missing APPLE_DIST_P12"
          [ -z "$PROFILE" ] && missing="$missing APPLE_PROVISIONING_PROFILE"
          if [ -n "$missing" ]; then
            echo "::warning::Not set:$missing — skipping TestFlight rather than signing automatically. See docs/ci.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        if: steps.creds.outputs.have == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          # UNTAP RATHER THAN SILENCE. GitHub's macOS image ships aws/tap
          # tapped, Homebrew now requires tap trust, and every brew command
          # prints a paragraph about it. We use brew for one formula and never
          # touch aws/tap, so removing it is the honest fix.
          #
          # NOT HOMEBREW_NO_REQUIRE_TAP_TRUST=1, which turns off the check for
          # every tap including ones we do use — and which Homebrew says it
          # will remove. Silencing a security warning by disabling the security
          # is the trade this repository keeps declining.
          #
          # `|| true` because a future image may not ship it, and a missing tap
          # must not fail a build.
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install xcodegen

      - name: Install the App Store Connect API key
        if: steps.creds.outputs.have == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        # An API key rather than certificates in the repo: it is one secret,
        # it is revocable from the web, and it lets xcodebuild create the
        # signing assets itself with -allowProvisioningUpdates. Fastlane match
        # solves the same problem by giving you a second repository of secrets
        # to look after.
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Generate the Xcode project
        if: steps.creds.outputs.have == 'true'
        working-directory: apps/ios
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcodegen generate
          # The team cannot live in project.yml — it is account-specific, and
          # anybody generating the project locally has their own.
          /usr/libexec/PlistBuddy -c "Print" Fleetwright.xcodeproj/project.pbxproj >/dev/null 2>&1 || true

      # The signing identity, imported rather than minted.
      #
      # -allowProvisioningUpdates creates a distribution certificate when it
      # cannot find one, and a CI runner is a fresh machine with an empty
      # keychain every time — so every release asked Apple for a new
      # certificate until the account hit its cap and archiving failed with
      # "Choose a certificate to revoke". The certificates it made were also
      # useless: their private keys lived on runners that no longer exist.
      #
      # One certificate, exported once, imported here. The API key still
      # handles the upload; only the identity stops being disposable.
      # THE PROFILE, INSTALLED RATHER THAN REQUESTED.
      #
      # A provisioning profile is not capped and could safely be created on
      # demand — but asking for one is what drags in automatic signing, and
      # automatic signing is what decides it needs a certificate. Installing
      # the profile means nothing has to be decided at build time.
      #
      # The SPECIFIER is read out of the profile rather than hardcoded, because
      # a name typed into a workflow and a name chosen in the developer portal
      # are two values that will eventually differ, and the failure reads as
      # "no profiles were found" — which is the same sentence a missing
      # certificate produces.
      - name: Install the provisioning profile
        if: steps.creds.outputs.have == 'true'
        id: profile
        env:
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$PROFILE" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"

          # A .mobileprovision is a CMS-signed plist; `security cms -D` is what
          # turns it back into something readable.
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          EXPIRES=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")

          # Said out loud. A profile that expired last week produces a signing
          # error about identities, and the date is the one fact that explains
          # it in one line.
          echo "profile: $NAME ($UUID)"
          echo "app id:  $APPID"
          echo "expires: $EXPIRES"

          # Installed under its UUID, which is the filename Xcode looks for.
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/profile.plist"

      - name: Import the signing certificate
        if: steps.creds.outputs.have == 'true'
        env:
          P12: ${{ secrets.APPLE_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ]; then
            echo "::warning::APPLE_DIST_P12 is not set — falling back to cloud signing, which mints a certificate per run."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # A throwaway keychain with a throwaway password: it lives for one
          # job on a machine that is destroyed afterwards, so the password
          # protects nothing and only has to exist.
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          printf '%s' "$P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          # -A would let ANY tool use the key without prompting. Limited to the
          # two that need it instead, which costs nothing here and is the sort
          # of default worth not copying from a blog post.
          # The failure this catches is not the one it names. macOS cannot read a
          # PKCS#12 written with OpenSSL 3's defaults — MAC sha256, AES-256-CBC —
          # and reports it as "MAC verification failed (wrong password?)", which
          # sends people to check a password that was always right.
          if ! security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
               -T /usr/bin/codesign -T /usr/bin/security 2>"$RUNNER_TEMP/import.err"; then
            cat "$RUNNER_TEMP/import.err"
            if grep -qi 'MAC verification failed' "$RUNNER_TEMP/import.err"; then
              echo "::error::Most likely the .p12 was exported with OpenSSL 3 defaults, which macOS cannot read."
              echo "Re-export the SAME key and certificate with -legacy, and check it says MAC: sha1:"
              echo "  openssl pkcs12 -export -legacy -inkey distribution.key -in distribution.pem -out distribution.p12"
              echo "  openssl pkcs12 -in distribution.p12 -info -nokeys -passin pass:... 2>&1 | grep MAC:"
              echo "If it already says sha1, check APPLE_DIST_P12_PASSWORD for a trailing newline —"
              echo "piping a file or an echo into a secret includes one, and it fails the same way."
            fi
            exit 1
          fi
          # Without this, codesign stops on a GUI prompt nobody can answer and
          # the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" >/dev/null
          # Prepended, not replaced: the system keychain still has to be
          # searchable for the Apple root certificates.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "imported $(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c 'Apple Distribution' || true) distribution identity"

      - name: Archive
        if: steps.creds.outputs.have == 'true'
        working-directory: apps/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # App Store Connect refuses a build number it has already seen for a
          # given version, so project.yml's CURRENT_PROJECT_VERSION of "1"
          # would have allowed exactly one upload ever. run_number only
          # increases.
          BUILD_NUMBER: ${{ github.run_number }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        # If this fails with "provisioning profile does not include the
        # com.apple.developer.applesignin entitlement", it is not a certificate
        # problem however much it reads like one. The app entitles Sign in with
        # Apple — that is the whole of how the app authenticates — and the App
        # ID has to carry the capability before a profile can include it.
        # -allowProvisioningUpdates with an API key usually enables it for you;
        # when it does not, it is one checkbox in the developer portal under
        # Identifiers -> network.thetech.fleetwright.
        run: |
          set -o pipefail
          # MANUAL, AND NO -allowProvisioningUpdates. Both halves matter.
          #
          # What failed before: CODE_SIGN_STYLE=Automatic let Xcode choose the
          # identity, and it chose Apple DEVELOPMENT — so the Apple
          # Distribution certificate imported one step earlier did not satisfy
          # it, -allowProvisioningUpdates dutifully asked Apple for a
          # development certificate, and after enough runs the account hit its
          # cap:
          #
          #   error: Choose a certificate to revoke. Your account has reached
          #          the maximum number of certificates.
          #   error: No profiles for 'network.thetech.fleetwright' were found:
          #          ... any iOS App Development provisioning profiles ...
          #
          # The second line is the tell. An archive should never be looking for
          # a DEVELOPMENT profile, and it was, because nothing had said which
          # kind of build this is.
          #
          # Naming the identity and the profile removes every decision from
          # build time. Dropping -allowProvisioningUpdates removes the ability
          # to mint anything at all — so the worst case is now a build that
          # fails, rather than a build that fails AND leaves the account one
          # certificate closer to unusable.
          xcodebuild archive \
            -project Fleetwright.xcodeproj \
            -scheme Fleetwright \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Fleetwright.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to TestFlight
        if: steps.creds.outputs.have == 'true'
        working-directory: apps/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_ID: network.thetech.fleetwright
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          # signingStyle manual, and the profile named per bundle id. Without
          # these two keys the export re-decides the signing it was just given,
          # and re-deciding is what asked Apple for certificates.
          #
          # The API key stays: it authenticates the UPLOAD, which is a
          # different thing from minting signing assets and the only reason it
          # is still here.
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Fleetwright.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

  # An upload is not a delivery. A build processes for anywhere between two
  # minutes and half an hour and then sits in App Store Connect until something
  # puts it in front of somebody.
  #
  # App Store Connect has a checkbox for this — "automatic distribution" on an
  # internal group — and it works. This does the same thing in a file that can
  # be reviewed, and that does not quietly stop applying when a group is
  # renamed or recreated.
  #
  # ubuntu, not macOS: it is one JWT and some HTTP, and holding a macOS runner
  # open for twenty minutes of polling would cost ten times as much for nothing.
      # always(), because the interesting case is the failed run: a keychain
      # left behind on a hosted runner is destroyed with the machine, but this
      # job is the only place that would ever hold a signing identity, and
      # "tidied up except when something went wrong" is not tidying up.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  distribute:
    name: distribute to internal testers
    needs: testflight
    if: needs.testflight.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    environment: production
    # App Store Connect's automatic distribution is now on for the internal
    # group, so assignment happens whether this job runs or not. What is left
    # here is "What to Test", which the checkbox cannot set — a nicety, and a
    # nicety must not be able to redden a run whose upload succeeded.
    #
    # The first automated note was refused for containing the robot emoji from
    # this project's own commit footer. That is exactly the class of failure
    # that should be a warning: the build is fine, the testers have it, and the
    # notes are missing a line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'
      - name: Assign the build to the internal group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: network.thetech.fleetwright
          # The same number the archive stamped, which is how the build is
          # found again — App Store Connect calls it "version" on a build,
          # confusingly.
          BUILD_NUMBER: ${{ github.run_number }}
          AUDIENCE: internal
          # Optional. Unset means the first internal group, which is right
          # while there is exactly one.
          INTERNAL_BETA_GROUP_NAME: ${{ vars.INTERNAL_BETA_GROUP_NAME }}
          # The commit is the honest answer to "what changed" for an internal
          # build that ships on every commit.
          WHATS_NEW: ${{ github.event.head_commit.message || github.sha }}
        run: node tools/testflight-distribute.mjs

  # External testers are the public, so this is NOT every commit on main. A
  # published release is a decision somebody made, which is the right shape for
  # a delivery that Apple reviews and that real people install.
  #
  # EVERY published release, prereleases included — that is the grammar:
  #
  #   prerelease published   external TestFlight only
  #   release published      external TestFlight AND the App Store (below)
  #
  # So "mark as prerelease" is how a build goes in front of external testers
  # without going in front of everybody, and clearing the box is the whole of
  # the promotion. One flag, GitHub's own, meaning exactly what it says.
  distribute-external:
    name: distribute to external testers
    needs: testflight
    if: github.event_name == 'release' && needs.testflight.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'
      - name: Assign the build to the external group and submit it for review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: network.thetech.fleetwright
          BUILD_NUMBER: ${{ github.run_number }}
          AUDIENCE: external
          EXTERNAL_BETA_GROUP_NAME: ${{ vars.EXTERNAL_BETA_GROUP_NAME }}
        run: |
          # THE NOTES COME FROM CHANGELOG.md, not from the release box.
          #
          # This used to be `github.event.release.body`, which is whatever was
          # pasted when the release was cut — usually the PR description, which
          # is written for a reviewer and reads like a diff. A tester opening
          # "What to Test" on a phone needs the two or three sentences somebody
          # wrote for them, and those live in the changelog, once, next to the
          # version the build is stamped with.
          #
          # The release body is the FALLBACK, not the source: if the changelog
          # has no section for this version the extractor exits non-zero and we
          # fall back rather than shipping empty notes. 4000 is App Store
          # Connect's limit for whatsNew.
          WHATS_NEW="$(node scripts/release-notes.mjs --max 4000 2>/dev/null)" || true
          if [ -z "$WHATS_NEW" ]; then
            echo "::warning::CHANGELOG.md had no notes for this build — falling back to the release body."
            WHATS_NEW="${{ github.event.release.body || github.event.release.name }}"
          fi
          export WHATS_NEW
          node tools/testflight-distribute.mjs

  # THE APP STORE. Only a FULL release — a prerelease stops at external
  # TestFlight above, which is what the prerelease box is for. This is the iOS
  # half of the Android grammar (android.yml ships Play production on the same
  # event): publishing a release IS the decision to ship to everybody, and
  # nothing else in the pipeline is allowed to mean that.
  #
  # The tool creates the App Store version named by the build's own version
  # train, attaches the build, carries the release notes over, and submits for
  # App Review. releaseType is AFTER_APPROVAL, so approval is the last human
  # step anywhere: when Apple says yes it is live, with no third state where a
  # green pipeline and an unshipped app are both true.
  #
  # What it cannot do is finish the LISTING — description, screenshots,
  # privacy, rating are once-ever answers given by hand in App Store Connect,
  # and the first run of this job fails with Apple naming what is missing
  # until they are. The checklist is in docs/ci.md.
  #
  # Re-runs are safe: an editable version is reused, a submitted one is left
  # alone, and a version already on the store says so and asks for a
  # MARKETING_VERSION bump by name.
  release-app-store:
    name: submit to the App Store
    needs: testflight
    if: >-
      github.event_name == 'release' && !github.event.release.prerelease
      && needs.testflight.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'
      - name: Create the App Store version and submit it for review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: network.thetech.fleetwright
          BUILD_NUMBER: ${{ github.run_number }}
          # The public "What's New in This Version", verbatim — the release
          # body is the one text somebody wrote knowing the public would read
          # it.
          WHATS_NEW: ${{ github.event.release.body || github.event.release.name }}
        run: node tools/appstore-release.mjs
