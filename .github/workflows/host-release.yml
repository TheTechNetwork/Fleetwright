name: Host release

# Built on every merge to main that changes something a host runs, and attached
# to a GitHub release when one is published.
#
# NOTHING CONSUMES IT YET AND THAT IS DELIBERATE — docs/packaging.md, step 2:
# "Nothing consumes them yet; they can be wrong without hurting anybody." A
# release pipeline that has never run is one nobody trusts on the day it
# matters, so it runs from the start and is checked by people before it is
# checked by machines.
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'install/**'
      - 'sandbox/**'
      - 'openapi.json'
      - 'package.json'
      - 'tools/build-host-package.mjs'
      - '.github/workflows/host-release.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    # Attaching to a release is a write. Nothing else here is, so the floor
    # above stays read and this one job raises it.
    permissions:
      contents: ${{ github.event_name == 'release' && 'write' || 'read' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'

      # esbuild only. The build bundles the ONE runtime dependency into the
      # artifact, which is the whole point — `npm ci` here is about what the
      # builder needs, not about what the host will need.
      - run: npm ci --no-audit --no-fund

      - name: Build the release
        id: build
        env:
          # A release from a tag is named after the tag; one from a merge is
          # named after the run, so two builds of main are never the same
          # version. Neither is a git sha, because a version somebody has to
          # read aloud on a phone call should be readable.
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('main-{0}', github.run_number) }}
        run: |
          node tools/build-host-package.mjs | tee build.log
          echo "sha256=$(awk '/^sha256/ {print $2}' build.log)" >> "$GITHUB_OUTPUT"

      # PROVED, NOT ASSERTED. The digest is the product here, and a digest that
      # depends on the machine that produced it is worth nothing. Building twice
      # in one job is the cheapest possible check that it does not.
      - name: Build it again and compare
        env:
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('main-{0}', github.run_number) }}
        run: |
          first="${{ steps.build.outputs.sha256 }}"
          rm -rf dist
          node tools/build-host-package.mjs > second.log
          second="$(awk '/^sha256/ {print $2}' second.log)"
          if [ "$first" != "$second" ]; then
            echo "::error::the build is not reproducible — $first then $second"
            exit 1
          fi
          echo "reproducible: $first"

      # Unpacked and run, from a directory with no node_modules and no source
      # tree. This is the failure the resources.js change exists to prevent, and
      # asserting it here means it cannot come back quietly.
      - name: Run the packaged bundle
        run: |
          mkdir -p /tmp/verify && tar -xzf dist/*.tar.gz -C /tmp/verify
          root="$(find /tmp/verify -maxdepth 1 -mindepth 1 -type d)"
          test ! -d "$root/node_modules"
          (cd / && node "$root/lib/agent-hub.mjs" --help | head -1)

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fleetwright-host
          path: |
            dist/*.tar.gz
            dist/manifest.json
          if-no-files-found: error

      # Only a published release gets a permanent home. A main build is an
      # artifact that expires, which is the right lifetime for something no
      # host is fetching yet.
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz dist/manifest.json --clobber
