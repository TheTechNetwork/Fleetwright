name: Host release

# Built on every merge to main that changes something a host runs, and attached
# to a GitHub release when one is published.
#
# NOTHING CONSUMES IT YET AND THAT IS DELIBERATE — docs/packaging.md, step 2:
# "Nothing consumes them yet; they can be wrong without hurting anybody." A
# release pipeline that has never run is one nobody trusts on the day it
# matters, so it runs from the start and is checked by people before it is
# checked by machines.
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'install/**'
      - 'sandbox/**'
      - 'openapi.json'
      - 'package.json'
      - 'tools/build-host-package.mjs'
      - '.github/workflows/host-release.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'

      # esbuild only. The build bundles the ONE runtime dependency into the
      # artifact, which is the whole point — `npm ci` here is about what the
      # builder needs, not about what the host will need.
      - run: npm ci --no-audit --no-fund

      - name: Build the release
        id: build
        env:
          # A release from a tag is named after the tag; one from a merge is
          # named after the run, so two builds of main are never the same
          # version. Neither is a git sha, because a version somebody has to
          # read aloud on a phone call should be readable.
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('main-{0}', github.run_number) }}
          # WHO IT IS FOR. GitHub already knows whether a release was marked as
          # a prerelease — that is the same box that decides TestFlight-only
          # versus the App Store — so the manifest says the same thing rather
          # than being told separately and disagreeing.
          #
          # A build from a push to main is a prerelease by definition: nobody
          # published it, and a host on the stable channel should not take
          # something that was never released.
          RELEASE_PRERELEASE: ${{ github.event_name != 'release' || github.event.release.prerelease }}
          # A repository variable, so widening a rollout is a setting somebody
          # changes rather than a commit. Unset means everybody, which is how
          # every release has behaved until now.
          RELEASE_ROLLOUT: ${{ vars.RELEASE_ROLLOUT }}
        run: |
          node tools/build-host-package.mjs | tee build.log
          echo "sha256=$(awk '/^sha256/ {print $2}' build.log)" >> "$GITHUB_OUTPUT"

      # PROVED, NOT ASSERTED. The digest is the product here, and a digest that
      # depends on the machine that produced it is worth nothing. Building twice
      # in one job is the cheapest possible check that it does not.
      - name: Build it again and compare
        env:
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('main-{0}', github.run_number) }}
          # WHO IT IS FOR. GitHub already knows whether a release was marked as
          # a prerelease — that is the same box that decides TestFlight-only
          # versus the App Store — so the manifest says the same thing rather
          # than being told separately and disagreeing.
          #
          # A build from a push to main is a prerelease by definition: nobody
          # published it, and a host on the stable channel should not take
          # something that was never released.
          RELEASE_PRERELEASE: ${{ github.event_name != 'release' || github.event.release.prerelease }}
          # A repository variable, so widening a rollout is a setting somebody
          # changes rather than a commit. Unset means everybody, which is how
          # every release has behaved until now.
          RELEASE_ROLLOUT: ${{ vars.RELEASE_ROLLOUT }}
        run: |
          first="${{ steps.build.outputs.sha256 }}"
          rm -rf dist
          node tools/build-host-package.mjs > second.log
          second="$(awk '/^sha256/ {print $2}' second.log)"
          if [ "$first" != "$second" ]; then
            echo "::error::the build is not reproducible — $first then $second"
            exit 1
          fi
          echo "reproducible: $first"

      # Unpacked and run, from a directory with no node_modules and no source
      # tree. This is the failure the resources.js change exists to prevent, and
      # asserting it here means it cannot come back quietly.
      - name: Run the packaged bundle
        run: |
          mkdir -p /tmp/verify && tar -xzf dist/*.tar.gz -C /tmp/verify
          root="$(find /tmp/verify -maxdepth 1 -mindepth 1 -type d)"
          test ! -d "$root/node_modules"
          (cd / && node "$root/lib/agent-hub.mjs" --help | head -1)

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fleetwright-host
          path: |
            dist/*.tar.gz
            dist/manifest.json
          if-no-files-found: error

  # A SEPARATE JOB PURELY TO HOLD THE WRITE PERMISSION, and the reason is worth
  # the extra job: `permissions:` DOES NOT TAKE EXPRESSIONS. Writing
  #
  #     contents: ${{ github.event_name == 'release' && 'write' || 'read' }}
  #
  # is not a conditional permission — it is an invalid workflow, and it fails
  # before any step runs, with "this run likely failed because of a workflow
  # file issue" and no line number. The alternative that parses is a static
  # `contents: write` on the build job, which would hand every merge to main the
  # ability to write to the repository to serve a case that only happens on a
  # release.
  #
  # So the permission lives where it is used, on a job that only exists when a
  # release is published.
  # THE PRERELEASE CHANNEL IS MAIN, and this is what makes it reachable.
  #
  # The package job has built a host tarball on every push for weeks and
  # uploaded it as a WORKFLOW ARTIFACT, which expires and has no stable URL — so
  # nothing could ever poll it. A prerelease host that wants "whatever is on
  # main" had nowhere to look.
  #
  # A ROLLING RELEASE AT A FIXED TAG gives it one. `releases/download/rolling/...`
  # is a permanent address whose contents are replaced on every merge, so a box
  # polls one URL for ever and gets the newest build.
  #
  # It is marked prerelease, which does two things: GitHub's own
  # `releases/latest` pointer SKIPS it — so stable hosts polling that address
  # keep getting published releases and never see main — and decideRelease
  # refuses it on a stable host even if somebody points one here by hand. The
  # URL selects; the flag verifies.
  #
  # NOT A GIT PULL. The box still fetches a signed-off tarball, checks the
  # sha256 before unpacking, unpacks beside what is running and moves a symlink.
  # Same mechanism as a release, different address.
  rolling-channel:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: fleetwright-host
          path: dist
      # THE TAG IS `rolling`, AND IT WAS `main` FOR ONE AFTERNOON.
      #
      # A tag named `main` beside a branch named `main` makes every bare `main`
      # in git ambiguous, and git resolves refs/tags/ FIRST — so `git checkout
      # main`, `git diff main` and `git log main..` all silently used the commit
      # the last rolling build was cut from, drifting one merge further behind
      # the branch every time this job ran. Git says "warning: refname 'main' is
      # ambiguous" and then does the wrong thing anyway, which is the worst of
      # both: a message nobody reads in a script, and a stale answer.
      #
      # `rolling` is also the name of the channel now, so the address and the
      # setting say the same word.
      - name: Publish as the rolling build
        env:
          GH_TOKEN: ${{ github.token }}
          # Same reason as the attach job below: this does not check the
          # repository out, and `gh` learns which repository it means from the
          # git remote.
          GH_REPO: ${{ github.repository }}
        run: |
          # Created once, replaced for ever after. `gh release create` fails
          # when the tag exists, and that failure is the ordinary case here, so
          # it is tried and tolerated rather than branched on — a `view` first
          # would be two API calls to learn what the create tells us anyway.
          gh release create rolling \
            --prerelease \
            --title "Rolling build from main" \
            --notes "The newest build of main. Hosts on AGENT_HUB_RELEASE_CHANNEL=rolling poll this; it is replaced on every merge and is not a published release." \
            --target main 2>/dev/null || true

          # --clobber, because the point is that these files are replaced.
          gh release upload rolling dist/*.tar.gz dist/manifest.json --clobber

          # AND THE OLD TARBALL GOES, because --clobber cannot reach it. The
          # tarball's name carries the build number (fleetwright-host-main-29),
          # so every merge uploads a NEW name beside the last one rather than
          # replacing it — the release accumulated one tarball per merge, for
          # ever, on an address whose whole promise is that its contents are
          # replaced. Nothing broke; manifest.json names the file it means. It
          # is a leak, and one that would have been discovered as a quota.
          #
          # Everything that is not what we just uploaded goes. Derived from the
          # files on disk rather than from a pattern, so a rename of the
          # artifact cannot leave this deleting the wrong thing.
          keep="manifest.json $(cd dist && ls -1 *.tar.gz | tr '\n' ' ')"
          echo "keeping: $keep"
          gh release view rolling --json assets --jq '.assets[].name' | while read -r asset; do
            case " $keep " in
              *" $asset "*) ;;
              *) echo "removing stale asset $asset"; gh release delete-asset rolling "$asset" --yes ;;
            esac
          done

          # THE TAG HAS TO FOLLOW MAIN, AND `--target` DOES NOT MOVE IT.
          #
          # `target_commitish` is only honoured when GitHub has to CREATE the
          # tag. On one that already exists it is accepted, reported as success
          # and ignored — so this line, which has been here since the rolling
          # build shipped, pinned the tag at whatever commit the FIRST run cut
          # it from and left it there for ever while --clobber kept the
          # artifacts current.
          #
          # That is the worst available combination: a release page dated weeks
          # ago, serving today's tarball, with nothing red and a comment above
          # it claiming otherwise. Moving the git ref is what actually moves a
          # tag, and `force` is required because this is not a fast-forward.
          if ! gh api -X PATCH "repos/$GH_REPO/git/refs/tags/rolling" \
                 -f sha="$GITHUB_SHA" -F force=true >/dev/null; then
            echo "::error::could not move the rolling tag to $GITHUB_SHA"
            exit 1
          fi

          # AND PROVED, because the failure this replaces was an API call that
          # reported success and changed nothing. Asserting the thing rather
          # than the call is the only version of this check worth having.
          at=$(gh api "repos/$GH_REPO/git/refs/tags/rolling" --jq '.object.sha')
          if [ "$at" != "$GITHUB_SHA" ]; then
            echo "::error::the rolling tag is at $at, not $GITHUB_SHA"
            exit 1
          fi
          echo "rolling is at $at"


  attach:
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: fleetwright-host
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # GH_REPO, BECAUSE THIS JOB DOES NOT CHECK THE REPOSITORY OUT.
          #
          # It has no reason to — it downloads an artifact and uploads it — and
          # `gh` works out which repository it means from the git remote. With
          # no checkout there is no remote, so it failed with
          #
          #   failed to run git: fatal: not a git repository
          #
          # on the v0.2.0 release, which is why no release carries a host
          # tarball or a manifest, which is why `/update` by manifest has
          # nothing to point at and the installer cannot fetch a package. One
          # missing environment variable held up the whole packaging plan, and
          # the job before it was green.
          #
          # This rather than `actions/checkout`: cloning the repository to name
          # it is a lot of work to avoid one line, and the point of this job is
          # that it needs nothing from the tree.
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz dist/manifest.json --clobber
