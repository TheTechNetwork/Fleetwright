name: Host release

# Built on every merge to main that changes something a host runs, and attached
# to a GitHub release when one is published.
#
# NOTHING CONSUMES IT YET AND THAT IS DELIBERATE — docs/packaging.md, step 2:
# "Nothing consumes them yet; they can be wrong without hurting anybody." A
# release pipeline that has never run is one nobody trusts on the day it
# matters, so it runs from the start and is checked by people before it is
# checked by machines.
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'install/**'
      - 'sandbox/**'
      - 'openapi.json'
      - 'package.json'
      - 'tools/build-host-package.mjs'
      - '.github/workflows/host-release.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'

      # esbuild only. The build bundles the ONE runtime dependency into the
      # artifact, which is the whole point — `npm ci` here is about what the
      # builder needs, not about what the host will need.
      - run: npm ci --no-audit --no-fund

      - name: Build the release
        id: build
        env:
          # A release from a tag is named after the tag; one from a merge is
          # named after the run, so two builds of main are never the same
          # version. Neither is a git sha, because a version somebody has to
          # read aloud on a phone call should be readable.
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('main-{0}', github.run_number) }}
        run: |
          node tools/build-host-package.mjs | tee build.log
          echo "sha256=$(awk '/^sha256/ {print $2}' build.log)" >> "$GITHUB_OUTPUT"

      # PROVED, NOT ASSERTED. The digest is the product here, and a digest that
      # depends on the machine that produced it is worth nothing. Building twice
      # in one job is the cheapest possible check that it does not.
      - name: Build it again and compare
        env:
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('main-{0}', github.run_number) }}
        run: |
          first="${{ steps.build.outputs.sha256 }}"
          rm -rf dist
          node tools/build-host-package.mjs > second.log
          second="$(awk '/^sha256/ {print $2}' second.log)"
          if [ "$first" != "$second" ]; then
            echo "::error::the build is not reproducible — $first then $second"
            exit 1
          fi
          echo "reproducible: $first"

      # Unpacked and run, from a directory with no node_modules and no source
      # tree. This is the failure the resources.js change exists to prevent, and
      # asserting it here means it cannot come back quietly.
      - name: Run the packaged bundle
        run: |
          mkdir -p /tmp/verify && tar -xzf dist/*.tar.gz -C /tmp/verify
          root="$(find /tmp/verify -maxdepth 1 -mindepth 1 -type d)"
          test ! -d "$root/node_modules"
          (cd / && node "$root/lib/agent-hub.mjs" --help | head -1)

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fleetwright-host
          path: |
            dist/*.tar.gz
            dist/manifest.json
          if-no-files-found: error

  # A SEPARATE JOB PURELY TO HOLD THE WRITE PERMISSION, and the reason is worth
  # the extra job: `permissions:` DOES NOT TAKE EXPRESSIONS. Writing
  #
  #     contents: ${{ github.event_name == 'release' && 'write' || 'read' }}
  #
  # is not a conditional permission — it is an invalid workflow, and it fails
  # before any step runs, with "this run likely failed because of a workflow
  # file issue" and no line number. The alternative that parses is a static
  # `contents: write` on the build job, which would hand every merge to main the
  # ability to write to the repository to serve a case that only happens on a
  # release.
  #
  # So the permission lives where it is used, on a job that only exists when a
  # release is published.
  attach:
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: fleetwright-host
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # GH_REPO, BECAUSE THIS JOB DOES NOT CHECK THE REPOSITORY OUT.
          #
          # It has no reason to — it downloads an artifact and uploads it — and
          # `gh` works out which repository it means from the git remote. With
          # no checkout there is no remote, so it failed with
          #
          #   failed to run git: fatal: not a git repository
          #
          # on the v0.2.0 release, which is why no release carries a host
          # tarball or a manifest, which is why `/update` by manifest has
          # nothing to point at and the installer cannot fetch a package. One
          # missing environment variable held up the whole packaging plan, and
          # the job before it was green.
          #
          # This rather than `actions/checkout`: cloning the repository to name
          # it is a lot of work to avoid one line, and the point of this job is
          # that it needs nothing from the tree.
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz dist/manifest.json --clobber
