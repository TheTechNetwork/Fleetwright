name: CodeQL

# WHY THIS FILE EXISTS. Code scanning was on GitHub's *default setup*, and it
# failed on two of the four languages in this repo, every run:
#
#   java   ERROR: Could not detect a suitable build command for the source checkout.
#   swift  ERRO [autobuilder/main] [no-project-found] `autobuild` detected neither
#          an Xcode project or workspace, nor a Swift package
#
# Neither is a broken build — both are autobuild looking in the wrong place:
#
#   * autobuild runs at the REPOSITORY ROOT. There is no settings.gradle there;
#     the Gradle build is at apps/android. Nothing to detect, so it gives up.
#   * there is no .xcodeproj, .xcworkspace or Package.swift ANYWHERE — the Xcode
#     project is generated from apps/ios/project.yml by XcodeGen and is
#     gitignored (see .gitignore). Nothing to detect there either, and no amount
#     of retrying will change that.
#
# A compiled language only lands in a CodeQL database if the extractor watches a
# real compiler run, so the fix is `build-mode: manual` and the same build
# commands android.yml and ios.yml already use. That means an advanced
# configuration, which means this file, which means **default setup has to be
# turned off in the repository settings** — the two cannot both upload results.
# Settings → Code security → Code scanning → CodeQL analysis → Disable.
#
# javascript-typescript and actions are here for the same reason: turning off
# default setup turns off everything it was analysing, and the 50-odd .js files
# under src/, worker/ and bin/ are the part of this repo that actually faces the
# network. They need no build, so they cost almost nothing to keep.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-published query finds the code without waiting for
    # somebody to open a pull request.
    - cron: '31 5 * * 1'
  workflow_dispatch:

# Deliberately NO paths filters. ios.yml and android.yml have them and should;
# a code-scanning run that skips itself reports no status at all, which reads as
# "nothing found" on a pull request and cannot be a required check.
permissions:
  contents: read

concurrency:
  # A PULL REQUEST shares a group per branch, so a new push supersedes the run
  # you stopped caring about. A PUSH gets a group of its own, keyed by SHA, so
  # it contends with nothing.
  #
  # `cancel-in-progress: false` is NOT enough to protect a run on main, which
  # is what the previous version of this assumed. GitHub cancels any
  # previously PENDING run in a group when a new one arrives, regardless of
  # that setting — it only governs runs that have already started. Two merges
  # four seconds apart is all it takes, and it happened here: the CodeQL run
  # for f6b0852 was created at 01:36:34, the run for b8ab592 at 01:36:38, and
  # f6b0852's was cancelled at 01:36:39 having never started.
  #
  # For code scanning that is a hole rather than a saving: main's analysis is
  # the baseline every alert is compared against, and a commit whose analysis
  # was cancelled is simply never looked at.
  group: codeql-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which languages this change could possibly affect.
  #
  # The header of this file says "deliberately NO paths filters", and that is
  # still right — for the `on:` trigger. A workflow that does not trigger
  # reports NO status, which is indistinguishable from one that never existed.
  # A job gated by `if:` reports "skipping", which is a visible, auditable
  # answer. That difference is the whole reason this is done here rather than
  # up there.
  #
  # Every language is gated on pull requests, each by the files that could
  # reach it: the compiled two because they are expensive (java-kotlin builds
  # an APK, swift queues for a macOS runner), and the interpreted two because
  # a docs-only pull request was still paying for a JavaScript analysis of
  # code it did not touch. `actions` answers to workflow changes,
  # `javascript-typescript` to anything that is not purely prose.
  #
  # main and the weekly schedule always run everything, so the alert baseline
  # is never built from a partial view. A PR gate cannot leave a gap: the merge
  # commit re-analyses in full.
  changes:
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      java: ${{ steps.filter.outputs.java }}
      code: ${{ steps.filter.outputs.code }}
      wf: ${{ steps.filter.outputs.wf }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Enough history to diff against the base, not the whole repo.
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then
            echo "not a pull request — analysing everything"
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "java=true"  >> "$GITHUB_OUTPUT"
            echo "code=true"  >> "$GITHUB_OUTPUT"
            echo "wf=true"    >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q --no-tags origin "$BASE"
          files=$(git diff --name-only "$(git merge-base "origin/$BASE" HEAD)" HEAD)
          echo "$files" | sed 's/^/  /'
          # The workflow itself counts: a change to how a language is built has
          # to be analysed by the job it changes.
          case "$files" in *apps/ios/*|*.github/workflows/codeql.yml*) swift=true ;; *) swift=false ;; esac
          case "$files" in *apps/android/*|*.github/workflows/codeql.yml*) java=true ;; *) java=false ;; esac
          # `actions` scans workflow files, so it answers to workflow changes.
          case "$files" in *.github/workflows/*) wf=true ;; *) wf=false ;; esac
          # Anything that is not purely prose could reach the JavaScript
          # analysis. Deciding what IS prose by allowlist, not by guessing at
          # code: a change made only of .md files, docs/, LICENSE and images
          # cannot alter a data flow.
          # Plain word-splitting: no filename in this repo carries a space,
          # and a heredoc's column-zero terminator cannot live inside a YAML
          # block scalar.
          code=false
          for f in $files; do
            case "$f" in
              *.md|docs/*|LICENSE|*.png|*.jpg|*.svg|.gitignore) ;;
              *) code=true; break ;;
            esac
          done
          echo "swift=$swift" >> "$GITHUB_OUTPUT"
          echo "java=$java"   >> "$GITHUB_OUTPUT"
          echo "code=$code"   >> "$GITHUB_OUTPUT"
          echo "wf=$wf"       >> "$GITHUB_OUTPUT"

  # No compiler involved, so no build steps and no runner cost worth managing.
  interpreted:
    name: analyze (${{ matrix.language }})
    needs: changes
    # Indexed by the matrix leg's own gate: js answers to "any non-prose
    # change", actions to "a workflow changed". A skip here is a VISIBLE
    # "skipping" on the pull request — the reason the gate lives on the job
    # and not on the trigger, where a filtered run reports nothing at all.
    if: ${{ needs.changes.outputs[matrix.gate] == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: javascript-typescript, gate: code }
          - { language: actions, gate: wf }
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # `none` means "extract the source directly". This is what autobuild
          # would have done for these two anyway; saying it explicitly means a
          # future language addition cannot silently fall back to guessing.
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # The one the java error was about. Everything here mirrors android.yml's
  # debug job — if that job builds, this one extracts.
  java-kotlin:
    name: analyze (java-kotlin)
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    # The Gradle LAUNCHER jvm needs this, not just the daemon. Same reason as
    # android.yml: JDK 25 warns that restricted native access "will be blocked
    # in a future release", and gradle.properties only covers the daemon.
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          # Pinned to the same packages android.yml installs. A missing platform
          # fails here with an obvious message instead of halfway through a
          # Gradle task — and under CodeQL a half-finished build is worse than a
          # failed one, because it uploads a database with holes in it.
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6

      # init BEFORE the build: the extractor works by watching the compiler, so
      # anything compiled before this step is invisible to it.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build the debug APK
        working-directory: apps/android
        # --no-daemon because a Gradle daemon survives the build and compiles in
        # a process the tracer never attached to; --no-build-cache because a
        # restored cache entry makes compileDebugKotlin FROM-CACHE, and a task
        # that does not run compiles nothing for CodeQL to see. Both failures
        # look identical from the outside: a green run and an empty database.
        run: ./gradlew --no-daemon --no-build-cache assembleDebug

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  # The one the swift error was about. The project autobuild could not find does
  # not exist until xcodegen writes it, which is the whole failure.
  # NOT ON PULL REQUESTS, and this is the one place in this file where that is
  # a real trade rather than a saving.
  #
  # Measured: 1127 seconds inside `xcodebuild`, against ~50 for the same
  # compile in ios.yml. The Swift extractor traces the compiler and pulls in
  # the SDK modules the app touches — Foundation, SwiftUI, AppIntents — and
  # there is no version of that which is quick. It is macOS-only, so it cannot
  # move to a cheaper runner, and Swift has no build-mode: none, so the build
  # cannot be skipped.
  #
  # Twenty minutes on the critical path of every app pull request is a tax that
  # gets paid by not opening pull requests. main and the weekly schedule still
  # analyse every line — a PR gate cannot leave a gap, because the merge commit
  # re-analyses in full. What is lost is finding an alert an hour earlier, on
  # four SwiftUI files with no dependencies.
  swift:
    name: analyze (swift)
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        # Without this, brew refreshes its entire formula index before
        # installing one small tool — routinely longer than the install.
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install xcodegen

      # Before init deliberately. Generating a pbxproj is not compilation, so it
      # does not need to be traced, and doing it first keeps the traced section
      # down to the one command that matters.
      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build
        working-directory: apps/ios
        # The simulator build from ios.yml, minus the xcbeautify pipe and its
        # `||` re-run: a second build of an already-built target compiles
        # nothing, so under CodeQL the retry would turn a build failure into an
        # empty database instead of a red run. CODE_SIGNING_ALLOWED=NO because
        # type-checking every line needs no team, certificate or profile.
        run: |
          set -o pipefail
          xcodebuild build \
            -project Fleetwright.xcodeproj \
            -scheme Fleetwright \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
