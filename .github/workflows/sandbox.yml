name: Sandbox image

# Built once, here, and pulled by every host — rather than built on each host at
# whatever moment it first needed one.
#
# That difference is not theoretical. CLAUDE_VERSION was `latest`, so the image
# a host ended up with depended on the day it built it; one box then had a CLI
# that behaved differently from another running the same commit. An image built
# in one place and pulled by name is the only version of "the sandbox" that is
# actually one thing.
on:
  # NOT sandbox/machine/, which is another image with a workflow of its own
  # (machine-image.yml): a change there changes nothing a session runs in,
  # and must not publish a new session image.
  push:
    branches: [main]
    paths: ['sandbox/**', '!sandbox/machine/**', '.github/workflows/sandbox.yml']
  pull_request:
    paths: ['sandbox/**', '!sandbox/machine/**', '.github/workflows/sandbox.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# packages: write is the whole reason this needs more than the default — it
# pushes to GHCR with the automatic token, so there is no registry credential
# to keep anywhere.
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      # arm64 as well as amd64: design.md's case for dialling out rather than
      # listening is a Pi behind a NAT, and an image that only runs on x86 makes
      # that a story rather than a deployment. QEMU makes the arm64 leg slow;
      # it is built once here instead of on the Pi, which is the trade.
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/fleetwright-session
          # `latest` is what a host pulls by default; the sha tag is what makes
          # "which image is that box running" answerable after the fact.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v7.4.0
        with:
          context: sandbox
          file: sandbox/Containerfile
          platforms: linux/amd64,linux/arm64
          # A pull request builds and throws it away: the point there is finding
          # out that the Containerfile is broken, not publishing it.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # THE SAME IMAGE WITH A BROWSER IN IT, as a separate tag rather than a
      # bigger default. Nobody pays for a capability they are not using: a box
      # that wants one is pointed at `:web` with FLEETWRIGHT_SANDBOX_IMAGE, and
      # every other box keeps the minimal image the Containerfile argues for.
      #
      # Built from the same file with one build-arg, so the two cannot drift —
      # a second Containerfile is a second thing to keep in step, and the half
      # nobody uses is the half that rots.
      - id: meta-web
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/fleetwright-session
          tags: |
            type=raw,value=web,enable={{is_default_branch}}
            type=sha,format=long,suffix=-web

      - uses: docker/build-push-action@v7.4.0
        with:
          context: sandbox
          file: sandbox/Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: WITH_CHROMIUM=1
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # AND THE SAME IMAGE WITH THE OTHER ENGINES IN IT (docs/engines.md):
      # Codex and OpenCode, at the versions the Containerfile pins. A third
      # tag for the reason `:web` is a second: a box that runs them is pointed
      # at `:engines` with FLEETWRIGHT_SANDBOX_IMAGE and names them in
      # FLEETWRIGHT_ENGINES, and every other box keeps the minimal image.
      #
      # NOTHING BUILT THIS BEFORE. The Containerfile took WITH_ENGINES=1 and
      # no workflow ever passed it, so the one layer that installs the
      # engines had never run anywhere but on an operator's own box, and a
      # box could report engines for which no image existed to pull.
      - id: meta-engines
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/fleetwright-session
          tags: |
            type=raw,value=engines,enable={{is_default_branch}}
            type=sha,format=long,suffix=-engines

      - uses: docker/build-push-action@v7.4.0
        with:
          context: sandbox
          file: sandbox/Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: WITH_ENGINES=1
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-engines.outputs.tags }}
          labels: ${{ steps.meta-engines.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # THE IMAGE, RUNNING. Everything above this line proves the Containerfile
  # builds; nothing proved the thing it built works, and the difference is not
  # academic — this image shipped for weeks with a PATH SHIM FOR `gh` AND NO
  # `gh` BEHIND IT. It built perfectly. A beta tester found it the only way
  # anybody could: `gh: command not found`, in a live session, with a working
  # credential broker sitting behind it.
  #
  # A build is a syntax check for a container. These are the assertions a
  # session makes on its first second, made here instead of on somebody's box.
  #
  # amd64 only and `load: true` rather than push: the arm64 leg is emulated
  # under QEMU and takes minutes to produce an answer that cannot differ for any
  # of this — every check below is about whether a file is present and runs, not
  # about machine code. cache-from is the same GHA cache the job above filled,
  # so this rebuilds nothing.
  smoke:
    name: the image actually runs
    needs: image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/build-push-action@v7.4.0
        with:
          context: sandbox
          file: sandbox/Containerfile
          platforms: linux/amd64
          load: true
          tags: fleetwright-session:smoke
          cache-from: type=gha

      # --entrypoint is overridden deliberately: tini + entrypoint.sh ends by
      # exec'ing claude, which would sit waiting for a terminal nobody is
      # attached to. The entrypoint itself is run separately below.
      - name: Everything a session expects to find on PATH
        run: |
          set -eu
          docker run --rm --entrypoint sh fleetwright-session:smoke -euc '
            for tool in node npm git rg gh claude fleet-cred git-credential-fleet fleetwright-session-hook; do
              command -v "$tool" >/dev/null || { echo "MISSING: $tool"; exit 1; }
            done
            node --version
            claude --version
            echo "--- PATH is complete ---"
          '

      # THE BROWSER VARIANT, RUN. The same argument as the `gh` shim below: an
      # image that builds is not an image that works, and "chromium is in the
      # apt line" is not "chromium starts". A browser has more ways to build and
      # not run than most things — missing fonts, a missing shared library, and
      # a sandbox it cannot enter.
      #
      # THE SANDBOX QUESTION IS ASKED HERE RATHER THAN ASSUMED. Chromium's own
      # sandbox needs user namespaces, which a rootless container may or may not
      # give it, and the usual answer is to reach for --no-sandbox and stop
      # thinking. This tries WITHOUT it first and reports which way it went, so
      # the answer is measured on the image we ship rather than guessed in a
      # comment.
      - name: The browser variant starts, and says whether it keeps its sandbox
        run: |
          set -eu
          docker build --build-arg WITH_CHROMIUM=1 -t fleetwright-session:web -f sandbox/Containerfile sandbox/
          docker run --rm --entrypoint sh fleetwright-session:web -euc '
            command -v chromium >/dev/null || { echo "MISSING: chromium"; exit 1; }
            chromium --version
            page="data:text/html,<h1>fleetwright</h1>"
            if chromium --headless --disable-gpu --dump-dom "$page" 2>/dev/null | grep -q fleetwright; then
              echo "--- chromium runs WITH its own sandbox ---"
            elif chromium --headless --disable-gpu --no-sandbox --dump-dom "$page" 2>/dev/null | grep -q fleetwright; then
              # Recorded rather than hidden. A browser rendering hostile HTML
              # with its sandbox off is inside the session container with the
              # session credentials, and somebody should know that is the trade
              # before they point a fleet at this tag.
              echo "--- chromium runs only with --no-sandbox, under DOCKER ---"
              # NAMES THE RUNTIME, because this job runs under docker and a
              # session runs under rootless podman. Their seccomp profiles and
              # their user-namespace defaults differ, so this is a true answer
              # about a DIFFERENT container — worth having, and not the one that
              # decides what a session gets.
              #
              # entrypoint.sh probes the real one at container start and sets
              # CHROMIUM_FLAGS there. This is the build-time canary: it proves
              # the browser runs at all, and says which way it had to.
              echo "::warning::under docker, chromium needs --no-sandbox. A session runs under rootless podman and is probed separately by entrypoint.sh — see it in the session log"
            else
              echo "chromium is installed and will not render a page either way"
              exit 1
            fi
          '

      # THE ENGINES VARIANT, RUN, for the reason the browser one is: an image
      # that builds is not one that works, and "the npm line names both
      # packages" is not "both commands start". Each ships a binary for the
      # machine it is installed on, chosen at install time, which is the part
      # that can build and not run.
      #
      # The runner that speaks to them is on every image, and is checked on
      # this one because this is where it has something to start. The minimal
      # image is checked for the other half of the same claim: a box that
      # does not name the engines must not turn out to have them.
      #
      # NO ENGINE IS ASKED ANYTHING HERE and none is signed in: `--version` is
      # the whole of this step. The two after it start them.
      - name: The engines variant has both engines, and each answers
        timeout-minutes: 15
        run: |
          set -eu
          docker build --build-arg WITH_ENGINES=1 -t fleetwright-session:engines -f sandbox/Containerfile sandbox/
          docker run --rm --entrypoint sh fleetwright-session:engines -euc '
            for tool in fleetwright-engine codex opencode; do
              command -v "$tool" >/dev/null || { echo "MISSING: $tool"; exit 1; }
            done
            codex --version
            opencode --version
            # What Codex asks for at every start, and says so as an error when it is not there.
            command -v bwrap >/dev/null || { echo "MISSING: bwrap"; exit 1; }
            echo "--- both engines answer ---"
          '
          docker run --rm --entrypoint sh fleetwright-session:smoke -euc '
            command -v fleetwright-engine >/dev/null || { echo "MISSING: fleetwright-engine"; exit 1; }
            for tool in codex opencode; do
              if command -v "$tool" >/dev/null; then echo "the minimal image has $tool, which no box was told it runs"; exit 1; fi
            done
            echo "--- the minimal image has neither ---"
          '

      # THE ENGINES, STARTED, UNDER WHAT A BOX RUNS THEM UNDER. `--version` is a
      # binary that loads. It is not the runner speaking to it, and for months
      # nothing was: every test of the runner used a stand-in, and a sign-in
      # that could not complete passed all of them (docs/engines.md, "What
      # has and has not been run").
      #
      # ROOTLESS PODMAN, because a session and a sign-in run under it and the
      # two questions below have different answers under docker: its seccomp
      # profile and its user namespaces are not Podman's. The image is the
      # one docker just built, handed over, not built twice.
      - name: The engines image, handed to rootless Podman
        timeout-minutes: 10
        run: |
          set -eu
          command -v podman >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y podman; }
          podman --version
          loaded=$(docker save fleetwright-session:engines | podman load)
          printf '%s\n' "$loaded"
          image=$(printf '%s\n' "$loaded" | sed -n -E 's/^Loaded image(\(s\))?: //p' | head -1)
          test -n "$image" || { echo "podman load did not say which image it loaded"; exit 1; }
          # A name with its registry in it, so nothing is looked up anywhere.
          podman tag "$image" localhost/fleetwright-session:engines-smoke
          podman image exists localhost/fleetwright-session:engines-smoke

      # WHAT A BOX RUNS TO SIGN AN ENGINE IN, AS IT RUNS IT: the image's own
      # entrypoint, a volume at /engine-home, `fleetwright-engine --signin`.
      # With no network at all, so no provider is asked anything and nobody
      # is signed in. What is proved is everything before the provider: the
      # runner starts the real engine on a home of its own, speaks to it,
      # and turns what it says into the one line a box reads, and exits 0.
      #
      # THE LINES ARE THE ONES SEEN BY HAND with these versions and no
      # network. Codex's is its own sentence, so only its beginning is held
      # to; OpenCode's and the two sign outs are this repository's.
      - name: The runner asks each real engine to sign in and out, with no network
        timeout-minutes: 10
        run: |
          set -eu
          image=localhost/fleetwright-session:engines-smoke
          podman volume create fw-engine-smoke >/dev/null
          ask() {
            timeout 180 podman run --rm --network none -v fw-engine-smoke:/engine-home -e FLEETWRIGHT_ENGINE_HOME=/engine-home "$image" fleetwright-engine "$@"
          }
          # <what was asked> <the line it must print, as a pattern for the whole line>
          expect() {
            asked=$1; want=$2
            set +e
            out=$(ask $asked); rc=$?
            set -e
            printf '%s\n' "--- fleetwright-engine $asked (exit $rc)" "$out"
            test "$rc" = 0 || { echo "fleetwright-engine $asked exited $rc: a box reads that as a container that failed"; exit 1; }
            printf '%s\n' "$out" | grep -qxE "$want" || { echo "fleetwright-engine $asked did not print the line expected: $want"; exit 1; }
          }
          expect '--signin codex' '\{"engine":"codex","signin":"done","state":"failed","detail":"failed to request device code: .*"\}'
          expect '--signin opencode' '\{"engine":"opencode","signin":"done","state":"failed","detail":"it could not ask GitHub for a code, and gave no reason\. This machine must be able to reach github\.com"\}'
          expect '--signout codex' '\{"engine":"codex","signin":"done","state":"signed_out"\}'
          expect '--signout opencode' '\{"engine":"opencode","signin":"done","state":"signed_out"\}'
          # A sign-in that failed keeps nothing, and the engine was not started
          # on the member's home: no file of either engine's is in it.
          left=$(podman run --rm --network none -v fw-engine-smoke:/engine-home --entrypoint sh "$image" -euc 'find /engine-home -type f')
          test -z "$left" || { echo "four failed or empty asks left files in the engine home:"; printf '%s\n' "$left"; exit 1; }
          podman volume rm fw-engine-smoke >/dev/null
          echo "--- both real engines were asked, and answered as the runner expects ---"

      # CODEX'S OWN SANDBOX, INSIDE THE SESSION'S CONTAINER. A session that
      # asks first starts Codex with `sandbox: workspace-write`, and Codex
      # then runs every command inside bubblewrap. Whether bubblewrap can
      # make its namespaces inside a rootless container was not known: no
      # turn has been sent to a real Codex. This asks the question with no
      # model in it: `codex sandbox` runs one command under the same policy
      # (`codex sandbox --help` at the pinned version; there is no
      # `debug landlock` in 0.171.0).
      #
      # BOTH USER NAMESPACES A BOX MAY BE SET TO (src/core/sandbox-userns.js).
      # A failure here is a `safe` Codex session that can run nothing, and
      # fails the job: that is the thing to know before a person finds it.
      - name: Codex keeps its own sandbox inside the session container, with no model asked
        timeout-minutes: 10
        run: |
          set -eu
          image=localhost/fleetwright-session:engines-smoke
          for userns in host nomap; do
            set +e
            out=$(timeout 120 podman run --rm --network none --userns="$userns" --entrypoint sh "$image" -euc '
              cd /work
              codex sandbox -c "sandbox_mode=\"workspace-write\"" -- sh -c "touch /work/sandbox-probe && echo wrote-the-workspace; touch /usr/sandbox-probe 2>/dev/null && echo WROTE-OUTSIDE-IT || echo refused-outside-it"
            ' 2>&1); rc=$?
            set -e
            printf '%s\n' "--- codex sandbox, --userns=$userns (exit $rc)" "$out"
            test "$rc" = 0 || { echo "under --userns=$userns Codex could not run a command in its sandbox: a session that asks first could run nothing on Codex"; exit 1; }
            printf '%s\n' "$out" | grep -qx 'wrote-the-workspace' || { echo "under --userns=$userns the sandbox did not let the command write its workspace"; exit 1; }
            printf '%s\n' "$out" | grep -qx 'refused-outside-it' || { echo "under --userns=$userns the sandbox let the command write outside its workspace"; exit 1; }
          done
          echo "--- Codex ran a command in its own sandbox, in both namespaces ---"

      # THE BUG THIS WHOLE JOB EXISTS FOR, and the shim is what makes it
      # testable without a credential. `gh` on PATH is /usr/local/bin/gh, the
      # shim; it resolves "the first gh on PATH that is not me" and execs it,
      # and when there is no such thing it exits 127 saying so. So:
      #
      #   gh --version        must succeed — the image installs a real gh
      #   wrangler --version  must exit 127 — the image deliberately does not,
      #                       and the shim has to REFUSE rather than hang
      #
      # Both halves matter. The first is the regression that reached a tester
      # (`gh: command not found`, with a working broker behind it). The second
      # is the failure the shim's own comments call the worst way for this to
      # break: a shim that finds itself, execs itself and spins forever. A hang
      # has no error message and no exit code, and a job asserting only the
      # happy path would sit there for six hours before anybody knew.
      #
      # Neither needs a broker: the shim treats a missing credential as
      # something for the real tool to complain about, not a reason to refuse.
      - name: The credential shims resolve a real tool, and refuse when there is none
        timeout-minutes: 2
        run: |
          set -eu
          docker run --rm --entrypoint sh fleetwright-session:smoke -euc '
            gh --version
            set +e
            out=$(wrangler --version 2>&1); rc=$?
            set -e
            test "$rc" = 127 || { echo "wrangler shim exited $rc, expected 127: $out"; exit 1; }
            case "$out" in
              *"not installed in this session"*) ;;
              *) echo "wrangler shim said something else: $out"; exit 1 ;;
            esac
            echo "--- one shim resolved, one refused, neither looped ---"
          '

      # The two dialogs that hung a session on hardware. Both are answered in
      # the image, and both answers are a JSON file that a later edit to the
      # Containerfile can silently stop writing.
      - name: The dialogs nobody is there to answer are pre-answered
        run: |
          set -eu
          docker run --rm --entrypoint node fleetwright-session:smoke -e '
            const state = require("/root/.claude.json");
            const work = state.projects?.["/work"] ?? {};
            if (!work.hasTrustDialogAccepted) throw new Error("folder trust is not pre-accepted for /work");
            if (!state.hasCompletedOnboarding) throw new Error("onboarding is not pre-completed");
            const settings = require("/etc/fleetwright-session/settings.json");
            if (!settings.skipDangerousModePermissionPrompt) throw new Error("the dangerous-mode prompt is not skipped");
            console.log("--- both dialogs answered ---");
          '

      # The entrypoint, run for real against an EMPTY /root/.claude — which is
      # the state a first session is in, and the reason the copy exists at all:
      # the volume mount shadows whatever the image put at that path. `true` as
      # the command replaces the claude it would otherwise exec.
      - name: The entrypoint seeds a first session
        run: |
          set -eu
          docker run --rm --tmpfs /root/.claude:rw fleetwright-session:smoke true
          docker run --rm --tmpfs /root/.claude:rw --entrypoint sh fleetwright-session:smoke -euc '
            /usr/local/bin/entrypoint true
            test -f /root/.claude/settings.json || { echo "the entrypoint did not seed settings.json"; exit 1; }
            grep -q skipDangerousModePermissionPrompt /root/.claude/settings.json
            # SCOPED to github.com, not a bare credential.helper — a global one is
            # consulted for every host a session ever clones from, and the
            # entrypoint deliberately does not set one. Asserting the bare key
            # would fail on correct config.
            test "$(git config --global --get credential.https://github.com.helper)" = fleet
            echo "--- a first session comes up seeded ---"
          '
