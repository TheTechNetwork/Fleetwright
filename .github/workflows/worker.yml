name: Worker

# No path filter, deliberately. The Worker bundles code from src/fleet/ that the
# sidecar and the Node coordinator also use, and the "must not import from node:"
# check below is a property of the whole repository rather than of one
# directory — a filtered workflow would let a change somewhere else break the
# Worker and not find out until a deploy. The check is a dry-run bundle: seconds,
# and no account needed.
on:
  # DEPLOYS on a push to main, so the filter is the difference between shipping
  # a change and redeploying a README. It had none: every commit to main
  # redeployed the Worker, including documentation.
  #
  # The list is what actually ends up in the bundle, which is more than
  # `worker/`. worker/src/fleet-do.js imports CoordinatorCore, the push
  # senders and the OIDC verifier straight out of src/fleet — the whole point
  # of that arrangement is that the same code runs in both coordinators, and
  # the cost is that changing it changes the Worker. A filter naming only
  # `worker/**` would quietly stop deploying the half of the Worker that lives
  # somewhere else, which is far worse than deploying too often.
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/fleet/**'
      # src/core is IN THE BUNDLE: the protocol module imports text.js and
      # names.js from it, and env-file/restart-watch sit beside them. The
      # original filter named only worker/** and src/fleet/**, which was true
      # the day it was written and silently stopped being true when the text
      # rules moved to src/core — a deploy filter has to name what the bundle
      # holds, not what the directory layout implies.
      - 'src/core/**'
      # AND src/mcp, WHICH IS THE SAME BUG A SECOND TIME. The comment above is
      # about src/core joining the bundle and the filter not noticing; six
      # files under src/mcp are in it too — worker.js mounts the remote MCP
      # server's routes — and this list did not name them.
      #
      # It cost a deploy. 0d3f8af ("Say which origin, because Google will not",
      # #291) changed src/mcp/authorize-page.js and otherwise only docs/ and
      # test/, so this workflow never ran and the Worker was never redeployed.
      # The fix reached production days later, carried by an unrelated commit.
      #
      # scripts/check-worker-filter.mjs now derives the answer from esbuild's
      # metafile and fails when this list does not cover what the bundle
      # actually holds, because this is the third time a human has been asked
      # to keep a list in step with an import graph.
      - 'src/mcp/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worker.yml'
      - '!**/*.md'
  # PULL REQUESTS NO LONGER FILTER AT THE TRIGGER. The old note here said the
  # filter was safe because branch protection did not exist; `Worker passed`
  # below is meant to be a required check, so it is not safe any more — a
  # filtered trigger reports NOTHING, and a required check waits for nothing
  # forever. The identical filter now lives in the `changes` job, where not
  # running is a visible "skipped". A docs-only pull request still does not pay
  # for a workerd boot.
  pull_request:
  # The merge queue, so the Worker is bundled and BOOTED against main plus
  # everything ahead of it in the queue rather than against the main it branched
  # from. This repository merges stacked pull requests bottom-up, which is
  # exactly the case where those two are different.
  merge_group:
  workflow_dispatch:
    inputs:
      # THE ONLY WAY THE APP KEY MOVES. Unticked, a manual run deploys exactly
      # what a push would. Ticked, it also runs the minter-key job below, which
      # waits for a reviewer on the `github-app-key` environment before it can
      # read the key at all. See that job for why it is not part of deploy.
      sync_app_key:
        description: 'Also sync the GitHub App key to the minting Worker (needs approval on github-app-key)'
        required: false
        default: false
        type: boolean

# One run per branch. Nothing here cancelled a superseded run before, so a
# branch pushed three times in a minute kept three builds alive and the answer
# you waited for was from the commit before last.
#
# PRs only, again: on main these jobs deploy the Worker, upload to TestFlight
# and attach a release APK. A cancelled PR run is waste; a cancelled main run
# is a thing that did not ship while reporting nothing wrong.
concurrency:
  # Deliberately NOT keyed by SHA, unlike ci.yml and codeql.yml. This workflow
  # ships something, and when two commits land close together the newest is the
  # one that should ship — so a shared group, where an older PENDING run is
  # dropped in favour of a newer one, is the behaviour we want rather than a
  # limitation to work around.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The deploy job authenticates to Cloudflare with CLOUDFLARE_API_TOKEN and to
# nothing else; GITHUB_TOKEN is never used. Deploy permissions and repository
# permissions are separate things and it is worth them looking separate.
permissions:
  contents: read

jobs:
  # WHETHER THIS CHANGE IS IN THE BUNDLE. The list is the push filter above,
  # word for word, and it has to stay that way: the two answer the same question
  # and the day they disagree is the day a pull request skips the check for a
  # change that then deploys. scripts/check-worker-filter.mjs asserts they
  # agree, and asserts both against the bundle esbuild actually produces.
  #
  # Wider than `worker/**` on purpose — worker/src/fleet-do.js imports
  # CoordinatorCore, the push senders and the OIDC verifier out of src/fleet,
  # and the protocol module imports text.js and names.js out of src/core. A
  # filter naming only the directory would quietly stop checking the half of the
  # Worker that lives somewhere else.
  #
  # Anything that is not a pull request — a push to main, a merge_group run —
  # gets true, because those are the events where a partial view is the thing
  # that ships.
  changes:
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.filter.outputs.bundle }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then
            echo "not a pull request — checking the Worker"
            echo "bundle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q --no-tags origin "$BASE"
          files=$(git diff --name-only "$(git merge-base "origin/$BASE" HEAD)" HEAD)
          echo "$files" | sed 's/^/  /'
          bundle=false
          for f in $files; do
            case "$f" in
              *.md) ;;
              worker/*|src/fleet/*|src/core/*|src/mcp/*|package.json|package-lock.json|.github/workflows/worker.yml)
                bundle=true; break ;;
              # Not in the bundle and not in the push filter — it deploys
              # nothing — but the container job below runs it, so a change to
              # it has to run that job to be checked at all.
              scripts/container-smoke.sh)
                bundle=true; break ;;
            esac
          done
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

  # Runs on every PR that touches the bundle and needs no secrets. --dry-run
  # does the whole bundle and the Durable Object migration check without
  # touching the account, which is what catches the mistake that actually
  # happens: something under src/fleet/ quietly starting to import from `node:`
  # and no longer being portable.
  check:
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.10.0'
      # The dry-run IS the portability test, so there is no separate lint for
      # it. wrangler resolves every import the Worker actually pulls in: if
      # something in the shared coordinator code starts importing from `node:`
      # and the compatibility flags do not allow it, the bundle fails right
      # here, with the offending import named.
      #
      # A grep was tried first and was worse in both directions. It failed on
      # test/helpers/node-coordinator.js, which is the NODE-ONLY transport
      # wrapper and is supposed to import node:http — while the file that
      # actually matters, core.js, is imported by both and was already clean.
      # The bundler knows which files are reachable; a grep is guessing.
      # wrangler comes from worker/package.json rather than being named again
      # here. Two declarations of the same tool is one for Renovate to bump and
      # one to forget, and they only disagree when it matters.
      # BOTH, and the root one is not optional. The Worker imports the shared
      # coordinator code out of ../../src, and that code imports `jose` — which
      # resolves from the repository root's node_modules, not the Worker's. A
      # bundle run in worker/ alone fails with "Could not resolve 'jose'".
      - name: Install the shared runtime dependencies
        run: npm install --no-audit --no-fund

      - name: Install the Worker toolchain
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Bundle the Worker without deploying it
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-build

      # THE SECOND SCRIPT, and it is bundled separately because it IS separate.
      # The demo and the product page were moved off the coordinator so that
      # the bundle holding the Durable Object and the App's client secret is
      # not also the one serving an unauthenticated page. A dry-run here is
      # what notices if that ever stops being true — if `demo-worker.js` grows
      # an import that drags the coordinator in, the bundle says so.
      - name: Bundle the demo Worker without deploying it
        working-directory: worker
        run: npx wrangler deploy --config wrangler.demo.toml --dry-run --outdir /tmp/demo-build

      # THE MINTING WORKER, bundled on its own for the same reason as the demo:
      # it holds the GitHub App key, so what it imports is the whole of what
      # could ever touch that key. If minter.js grows an import that drags the
      # coordinator in, this is where it shows.
      - name: Bundle the minting Worker without deploying it
        working-directory: worker
        run: npx wrangler deploy --config wrangler.minter.toml --dry-run --outdir /tmp/minter-build

      # THE CONFIG THAT ACTUALLY DEPLOYS. wrangler.toml above is the fork-safe
      # default; wrangler.production.toml is ours and is what the deploy job
      # uses. A syntax error in the file nobody dry-runs is a syntax error
      # discovered by a failed production deploy.
      - name: Bundle our production config without deploying it
        working-directory: worker
        run: npx wrangler deploy --config wrangler.production.toml --dry-run --outdir /tmp/prod-build

      # The Worker, RUNNING, in workerd — the runtime it ships to. The fleet
      # went down on a bug that only exists in that runtime (a floating
      # storage-write rejection aborts the Durable Object), and nothing here
      # had ever executed the Worker at all: the coordinator logic was tested
      # in Node and the bundle step proves it parses. This boots the real
      # thing, enrols a real host over the real handshake, and floods it.
      - name: Run the Worker in workerd and drive it
        working-directory: worker
        run: npm test

  # THE SAME BUNDLE, AS A CONTAINER, BUILT AND DRIVEN. worker/Containerfile is
  # the door coordinator-deploy.md keeps open for whoever has no Cloudflare
  # account: workerd running the bundle `wrangler deploy` ships, with the
  # Durable Object's SQLite on a volume. Its comment said what had been proven
  # of it — built, started, driven, state surviving a restart — and that was
  # true once, on one machine. Nothing kept it true: the capnp maps every
  # variable by hand, the Containerfile pins a runtime, and a bundle change
  # that adds an `env.X` the capnp does not name is silent.
  #
  # scripts/container-smoke.sh is that paragraph as a script. It builds the
  # image, starts it, mints a pin, enrols a REAL host with bin/fleetwright-sidecar,
  # restarts the container and shows the host is still known and a pin minted
  # before the restart still spends after it. Docker here; podman where it was
  # first run — the script takes either.
  #
  # Gated like `check`, on the same answer: a change that is not in the bundle
  # does not build an image of it. And in `gate`'s list, so a red build here is
  # a red `Worker passed`, the one check branch protection reads.
  container:
    name: the coordinator container runs
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.10.0'
      # The ROOT dependencies only: the sidecar that enrols against the
      # container imports `jose` from here. The image builds its own inside
      # the build stage and needs nothing from the runner.
      - name: Install the shared runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Build the image and drive it, as an operator and then as a host
        run: scripts/container-smoke.sh

  deploy:
    needs: check
    # `github.ref` on a merge_group run is the queue's own
    # `refs/heads/gh-readonly-queue/...` branch, so this condition already
    # excludes it — a queue run bundles and boots the Worker and deploys
    # nothing. Said here because "it happens to be excluded" is how a queue run
    # eventually ships something nobody merged.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.10.0'

      # A step's own `env:` is not visible to that step's `if:` — the guard has
      # to be a separate step that writes an output. Doing it the other way is
      # what made this workflow unparseable on its first run.
      - name: Check the account is configured
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the Worker was built but not deployed. See docs/ci.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      # Skipped rather than failed when the account is not configured yet, so a
      # fork or a fresh clone does not show a permanently red main.
      - name: Deploy
        if: steps.creds.outputs.have == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CONFIG: ${{ vars.WRANGLER_CONFIG }}
          # Both public: the App's client id, and whose repositories the
          # minting Worker may mint into. Repository VARIABLES, not secrets.
          MINT_CLIENT_ID: ${{ vars.FLEETWRIGHT_GITHUB_CLIENT_ID }}
          MINT_OWNERS: ${{ vars.FLEETWRIGHT_GITHUB_MINT_OWNERS }}
        run: |
          # Root first: the Worker bundles ../../src, which imports `jose` from
          # the repository root's node_modules. See the check job.
          npm --prefix "$GITHUB_WORKSPACE" install --no-audit --no-fund
          npm install --no-audit --no-fund

          # THE MINTING WORKER FIRST, because the coordinator's config binds it
          # and a service binding has to have something to point at when the
          # coordinator deploys. Both committed configs bind it; the check is
          # for a config of somebody's own that does not.
          config="${WRANGLER_CONFIG:-wrangler.toml}"
          if grep -q '^service = "fleetwright-minter"' "$config"; then
            minter_vars=()
            [ -n "${MINT_CLIENT_ID:-}" ] && minter_vars+=(--var "FLEETWRIGHT_GITHUB_CLIENT_ID:$MINT_CLIENT_ID")
            [ -n "${MINT_OWNERS:-}" ] && minter_vars+=(--var "FLEETWRIGHT_GITHUB_MINT_OWNERS:$MINT_OWNERS")
            npx wrangler deploy --config wrangler.minter.toml ${minter_vars[@]+"${minter_vars[@]}"}
            if [ -z "${MINT_OWNERS:-}" ]; then
              echo "::notice::The minting Worker is deployed with no FLEETWRIGHT_GITHUB_MINT_OWNERS variable, so it mints for nobody."
            fi
          fi

          # WHICH CONFIG, and the default is the SAFE one.
          #
          # `wrangler.toml` is the fork-safe file: no routes, no allowlist, no
          # Sentry project, no GitHub App. `wrangler.production.toml` is ours.
          # A fork running this workflow must not deploy our config, so the path
          # comes from a repository variable that this repository sets and a
          # fork does not — and the fallback is the file that names nobody.
          #
          # A repository VARIABLE rather than a secret: it is a filename, and a
          # secret would be unreadable in the log at the moment somebody is
          # trying to work out which config a deploy used.
          npx wrangler deploy --config "${WRANGLER_CONFIG:-wrangler.toml}"

          # The demo and the product page, on their own script. Deployed after
          # the coordinator and in the same step on purpose: they are one
          # commit's worth of change, and a page that describes a coordinator
          # older than itself is the drift this split was meant to avoid.
          #
          # It has no secrets to sync — see the step below, which is entirely
          # about the coordinator's.
          npx wrangler deploy --config wrangler.demo.toml

      # The Worker's RUNTIME secrets are a different thing from the credentials
      # used to deploy it: they live in Cloudflare, not in GitHub, and
      # `wrangler deploy` does not touch them. A Worker deployed without them
      # answers 503 to everything, on purpose — a coordinator with no
      # credentials is remote control of every box in the fleet for whoever
      # finds the URL.
      #
      # Syncing them here means GitHub is the one place you manage them. Each is
      # optional and skipped when unset, so this does not force secrets on a
      # deployment that sets them with `wrangler secret put` directly.
      - name: Sync the Worker's runtime secrets
        if: steps.creds.outputs.have == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLEETWRIGHT_API_TOKEN: ${{ secrets.FLEETWRIGHT_API_TOKEN || secrets.AGENT_FLEET_API_TOKEN }}
          # WHO IS ALLOWED IN, and it is a secret rather than a var for one
          # reason: it decides who can reach a fleet, and this repository is
          # public. It was BOTH — synced here and also set in the committed
          # config — and Cloudflare keeps vars and secrets in one namespace, so
          # every deploy clobbered the secret with the committed list. The sync
          # has been running and having no effect.
          #
          # ONE HOME PER NAME is the rule the config file states, and
          # FLEETWRIGHT_AUTH_ISSUERS and _AUDIENCES are gone from here for the
          # same reason in the other direction: they are public identifiers,
          # they live in wrangler.production.toml as vars, and syncing them here
          # as well made a second home that the first one silently overwrote.
          FLEETWRIGHT_AUTH_ALLOW: ${{ vars.FLEETWRIGHT_AUTH_ALLOW || vars.AGENT_FLEET_AUTH_ALLOW }}
          FLEETWRIGHT_FCM_SERVICE_ACCOUNT: ${{ secrets.FLEETWRIGHT_FCM_SERVICE_ACCOUNT || secrets.AGENT_FLEET_FCM_SERVICE_ACCOUNT }}
          FLEETWRIGHT_APNS_KEY: ${{ secrets.FLEETWRIGHT_APNS_KEY || secrets.AGENT_FLEET_APNS_KEY }}
          FLEETWRIGHT_APNS_KEY_ID: ${{ secrets.FLEETWRIGHT_APNS_KEY_ID || secrets.AGENT_FLEET_APNS_KEY_ID }}
          # Reused rather than duplicated: the APNs team id is the same team id
          # the iOS build signs with, and two copies of one value is two chances
          # for them to disagree.
          #
          # `vars`, NOT `secrets`, and this line read the wrong one. GitHub keeps
          # the two in separate namespaces, so a name in both is not a clobber
          # like Cloudflare's — it is two slots, one of them empty, and nothing
          # says which. docs/ci.md has said "a variable, not a secret — it is
          # public" since the iOS workflow was written, and ios.yml reads
          # `vars.APPLE_TEAM_ID`; only this line disagreed, so an operator who
          # followed the documentation deployed a Worker with an empty team id.
          #
          # What that costs is precise and quiet: `apnsFromEnv` refuses two
          # thirds of a credential set, warns once at boot, and every iOS
          # notification goes to the log instead of to Apple — on a fleet where
          # Android keeps working and everything else looks configured. The very
          # failure src/fleet/push.js spends a page making loud.
          FLEETWRIGHT_APNS_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # The GitHub App's client secret, for the OAuth code exchange. The
          # App's PRIVATE KEY is deliberately not here: it mints installation
          # tokens for every installation of the App, so the coordinator never
          # holds it. It goes to the minting Worker, in the step after this one.
          # See docs/github-app.md.
          FLEETWRIGHT_GITHUB_CLIENT_SECRET: ${{ secrets.FLEETWRIGHT_GITHUB_CLIENT_SECRET || secrets.AGENT_FLEET_GITHUB_CLIENT_SECRET }}
          # The Cloudflare OAuth client's secret, for the same exchange against
          # the second provider. The client id and scope list are [vars] in
          # wrangler.production.toml; this is the half that must not be.
          FLEETWRIGHT_CLOUDFLARE_CLIENT_SECRET: ${{ secrets.FLEETWRIGHT_CLOUDFLARE_CLIENT_SECRET || secrets.AGENT_FLEET_CLOUDFLARE_CLIENT_SECRET }}
        run: |
          set -u
          missing=""
          for name in FLEETWRIGHT_API_TOKEN FLEETWRIGHT_FCM_SERVICE_ACCOUNT \
                      FLEETWRIGHT_APNS_KEY FLEETWRIGHT_APNS_KEY_ID FLEETWRIGHT_APNS_TEAM_ID \
                      FLEETWRIGHT_AUTH_ALLOW \
                      FLEETWRIGHT_GITHUB_CLIENT_SECRET FLEETWRIGHT_CLOUDFLARE_CLIENT_SECRET; do
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then
              missing="$missing $name"
              continue
            fi
            # printf, not echo: a service-account JSON contains backslashes that
            # some shells' echo would interpret.
            printf '%s' "$value" | npx wrangler secret put "$name"
            echo "synced $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Not set as repository secrets, so left as they are in Cloudflare:$missing"
            echo "The coordinator answers 503 to everything until FLEETWRIGHT_API_TOKEN exists, and 503 to"
            echo "sign-in until FLEETWRIGHT_AUTH_ISSUERS and FLEETWRIGHT_AUTH_AUDIENCES are set — those are"
            echo "[vars] in the config rather than secrets. FLEETWRIGHT_AUTH_ALLOW is a secret, and an EMPTY"
            echo "one admits nobody: the safe default, and also a fleet nobody can sign in to."
            echo "Hosts need none of it: they enrol with a pin and authenticate by signature."
          fi

      - name: Where it landed
        if: steps.creds.outputs.have == 'true'
        run: echo "::notice::Deployed. Point a host at it with FLEETWRIGHT_COORDINATOR_URL — see docs/coordinator-deploy.md."

  # THE APP'S PRIVATE KEY, TO THE MINTING WORKER AND NOWHERE ELSE — in a job of
  # its own, behind an environment of its own, and only when a person asks.
  #
  # The key can mint an installation token for EVERY installation of the App,
  # and the App is installable on any account. So it is kept out of the deploy
  # job, which runs on every push to main in the `production` environment:
  # there it would be one workflow edit away from being printed. Here it is an
  # ENVIRONMENT secret of `github-app-key`, which an operator protects with a
  # required reviewer and main-only deployment branches. This job then cannot
  # start, let alone read the key, until a named person approves it.
  #
  # It runs only on a manual run with `sync_app_key` ticked. `wrangler secret
  # put` stores the key on the Worker, so it is needed once and on rotation,
  # not on every deploy. The deploy job never sees this secret, and this job
  # never deploys code.
  #
  # Failed rather than skipped when anything is missing, unlike the deploy: this
  # only runs because a person asked for the key to be synced, so green has to
  # mean it was. A fork or a fresh clone never ticks the box, so stays green.
  minter-key:
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.sync_app_key
    runs-on: ubuntu-latest
    environment: github-app-key
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.10.0'
      - name: Sync the minting Worker's key
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CONFIG: ${{ vars.WRANGLER_CONFIG }}
          FLEETWRIGHT_GITHUB_APP_KEY: ${{ secrets.FLEETWRIGHT_GITHUB_APP_KEY }}
        run: |
          set -u
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not visible to the github-app-key environment. A secret of the production environment is not: make it a repository secret, or add it to github-app-key as well. See docs/ci.md."
            exit 1
          fi
          config="${WRANGLER_CONFIG:-wrangler.toml}"
          if ! grep -q '^service = "fleetwright-minter"' "$config"; then
            echo "::error::$config binds no minting Worker, so there is nowhere to put the App key."
            exit 1
          fi
          if [ -z "${FLEETWRIGHT_GITHUB_APP_KEY:-}" ]; then
            echo "::error::No FLEETWRIGHT_GITHUB_APP_KEY secret on the github-app-key environment. It is an ENVIRONMENT secret, not a repository one: see docs/github-app.md."
            exit 1
          fi
          # wrangler only: `secret put` uploads a value and bundles nothing,
          # so the repository root's dependencies are not needed here.
          npm install --no-audit --no-fund
          printf '%s' "$FLEETWRIGHT_GITHUB_APP_KEY" | npx wrangler secret put FLEETWRIGHT_GITHUB_APP_KEY --config wrangler.minter.toml
          echo "synced FLEETWRIGHT_GITHUB_APP_KEY to the minting Worker"

  # The one required check for this workflow, for the same reason ci.yml has
  # one: `check` and `container` are skipped on a change that is not in the
  # bundle, and a required check has to report something on every pull
  # request. Skipped is a pass here; failed and cancelled are not.
  gate:
    name: Worker passed
    needs: [changes, check, container]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job above either passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -eu
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a job this gate depends on reported '$r'"; exit 1 ;;
            esac
          done
          echo "Worker passed"
