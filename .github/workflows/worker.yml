name: Worker

# No path filter, deliberately. The Worker bundles code from src/fleet/ that the
# sidecar and the Node coordinator also use, and the "must not import from node:"
# check below is a property of the whole repository rather than of one
# directory — a filtered workflow would let a change somewhere else break the
# Worker and not find out until a deploy. The check is a dry-run bundle: seconds,
# and no account needed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on every PR and needs no secrets. --dry-run does the whole bundle and
  # the Durable Object migration check without touching the account, which is
  # what catches the mistake that actually happens: something under src/fleet/
  # quietly starting to import from `node:` and no longer being portable.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bundle the Worker without deploying it
        working-directory: worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/worker-build

      # The rule that keeps one implementation instead of two. If this fails,
      # the Worker and the Node coordinator have started to diverge.
      - name: "The shared coordinator code must not import from node:"
        run: |
          if grep -rn "from 'node:" src/fleet/coordinator src/fleet/protocol src/fleet/push.js; then
            echo "::error::src/fleet/{coordinator,protocol,push} must run in both Node and Workers."
            exit 1
          fi
          echo "portable"

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # A step's own `env:` is not visible to that step's `if:` — the guard has
      # to be a separate step that writes an output. Doing it the other way is
      # what made this workflow unparseable on its first run.
      - name: Check the account is configured
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the Worker was built but not deployed. See docs/ci.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      # Skipped rather than failed when the account is not configured yet, so a
      # fork or a fresh clone does not show a permanently red main.
      - name: Deploy
        if: steps.creds.outputs.have == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
