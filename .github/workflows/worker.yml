name: Worker

on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/fleet/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**', 'src/fleet/**', '.github/workflows/worker.yml']
  workflow_dispatch:

jobs:
  # Runs on every PR and needs no secrets. --dry-run does the whole bundle and
  # the Durable Object migration check without touching the account, which is
  # what catches the mistake that actually happens: something under src/fleet/
  # quietly starting to import from `node:` and no longer being portable.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle the Worker without deploying it
        working-directory: worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/worker-build

      # The rule that keeps one implementation instead of two. If this fails,
      # the Worker and the Node coordinator have started to diverge.
      - name: The shared coordinator code must not import from node:
        run: |
          if grep -rn "from 'node:" src/fleet/coordinator src/fleet/protocol src/fleet/push.js; then
            echo "::error::src/fleet/{coordinator,protocol,push} must run in both Node and Workers."
            exit 1
          fi
          echo "portable"

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Skipped rather than failed when the account is not configured yet, so a
      # fork or a fresh clone does not show a permanently red main.
      - name: Deploy
        id: deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Say why nothing was deployed
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the Worker was built but not deployed."
          echo "See docs/ci.md for the two secrets this needs."
