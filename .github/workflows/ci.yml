name: CI

on:
  push:
    branches: [main]
  pull_request:

# One workflow for the whole monorepo. agent-hub carries its own
# .github/workflows/ci.yml from upstream, but GitHub only runs workflows from
# the repository root, so that file is inert — its steps are reproduced here.
# See agent-hub/UPSTREAM.md.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Neither package has runtime dependencies or a build step. The only
      # install is the typescript devDependency used to check the JSDoc
      # annotations, and Node resolves it up the tree for both.
      - run: npm install --no-audit --no-fund

      - name: agent-fleet — tests
        run: npm run test:fleet
      - name: agent-fleet — typecheck
        run: npm run typecheck:fleet

      - name: agent-hub — tests
        run: npm run test:hub
      - name: agent-hub — typecheck
        run: npm run typecheck:hub

      # The installer is the thing a new operator runs first, so a syntax error
      # in it is a worse bug than one in the service.
      - name: agent-hub — installer syntax
        run: bash -n agent-hub/install/install.sh
