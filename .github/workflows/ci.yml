name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      # No runtime dependencies and no build step. The only install is the
      # typescript devDependency used to check the JSDoc annotations.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck

      # The installer is the thing a new operator runs first, so a syntax error
      # in it is a worse bug than one in the service.
      - run: bash -n install/install.sh

      # An unparseable workflow does not fail a check — it shows up as a run
      # named after the FILE PATH, with no jobs, which is easy to miss entirely.
      # This one cost a round trip to notice, so it is a check now.
      # Renovate rejects a config with an invalid option, and the way you find
      # out is that your rules silently do not apply — no grouping, no limits,
      # just the defaults doing whatever they were going to do. An invalid `//`
      # key sat on main doing exactly that.
      - name: Renovate config is valid
        run: npx --yes --package renovate renovate-config-validator renovate.json

      - name: Workflows parse
        run: |
          npm i --no-save --no-audit --no-fund js-yaml
          node -e '
            const yaml = require("js-yaml"), fs = require("fs");
            let bad = 0;
            for (const f of fs.readdirSync(".github/workflows")) {
              try {
                const doc = yaml.load(fs.readFileSync(".github/workflows/" + f, "utf8"));
                if (!doc.jobs || !Object.keys(doc.jobs).length) throw new Error("no jobs");
                console.log("ok   " + f);
              } catch (e) {
                bad++;
                console.log("::error file=.github/workflows/" + f + "::" + e.message.split("\n")[0]);
              }
            }
            process.exit(bad ? 1 : 0);
          '
