name: CI

on:
  # NO PATHS FILTER AT ALL, and that is the change. It used to be
  # `paths-ignore: ['**/*.md', 'docs/**', 'apps/**', 'sandbox/**', 'LICENSE']`,
  # with a note saying that was safe because nothing here is a required status.
  #
  # It was not safe, and the note was measuring the wrong risk. The filter did
  # not just skip a check nobody required — IT SKIPPED THE TESTS THAT GUARD THE
  # FILES IT WAS SKIPPING FOR:
  #
  #   apps/**   TWENTY-TWO tests in test/ read the Swift and the Kotlin. They
  #             are the parity suite — both phones say the same five things in
  #             the same order (reassurance.test.js), both carry the same verbs,
  #             both compute quietFor and show it. The app workflows compile the
  #             app; NOTHING ELSE ASSERTS ANY OF THAT. So the one change those
  #             tests exist for — an edit to an app — was the one change that
  #             did not run them.
  #
  #   docs/**   install-node-floor.test.js reads docs/deployment.md and asserts
  #             the Node floor it states matches package.json. Editing that
  #             document alone skipped the test whose whole subject is that
  #             document.
  #
  #   sandbox/**  verify.sh parses entrypoint.sh and tool-shim.sh, and
  #             sandbox.yml only ever built the image. A sandbox-only change
  #             reached main having had its shell read by nothing.
  #
  # That is the same failure in three places, and it is not fixable by writing
  # a cleverer filter: a filter has to know which tests read which files, and it
  # learns that a year late, from a bug. So it is gone.
  #
  # THE PRICE IS A FEW MINUTES OF UBUNTU ON A DOCS PULL REQUEST, and
  # docs/ci-scope.md's own rule already priced it: "if this job does not run,
  # does anybody find out?" — nothing else reports the root suite, so no — and
  # "if it runs twice, what does it cost?" — for a test, a minute. The suite is
  # 21 seconds. The expensive filters, the ones guarding a macOS runner, a build
  # number and a deploy, are untouched and stay where they are.
  push:
    branches: [main]
  pull_request:
  # THE MERGE QUEUE, which is the only thing here that can answer "does this
  # break main" rather than "did this break the main it branched from". A pull
  # request is tested against its own base; two of them, each green, can be red
  # together — and this repository merges STACKED pull requests bottom-up
  # (CONTRIBUTING.md), which is that situation on purpose. `merge_group` runs
  # everything against main plus whatever is ahead of it in the queue,
  # immediately before it lands.
  #
  # Harmless until a queue is enabled; enabling one without this would hang
  # every merge, because the queue waits for checks that never start.
  merge_group:

# One run per branch. Nothing here cancelled a superseded run before, so a
# branch pushed three times in a minute kept three builds alive and the answer
# you waited for was from the commit before last.
#
# PRs only, again: on main these jobs deploy the Worker, upload to TestFlight
# and attach a release APK. A cancelled PR run is waste; a cancelled main run
# is a thing that did not ship while reporting nothing wrong.
concurrency:
  # Per-SHA on a push, per-branch on a PR — see the long note in codeql.yml.
  # A pending run is cancelled by the next one whatever cancel-in-progress
  # says, so two quick merges would leave a commit on main with no test result
  # at all.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  # Never on a merge_group run either: `github.ref` there is the queue's own
  # temporary branch, so it does not collide with anything — and a cancelled
  # queue run drops the merge, which is the same failure as a cancelled push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only, and nothing here has ever needed more. Spelled out rather than
# inherited: the repository default applies to workflows nobody has looked at in
# a year, and `contents: read` is the thing you want to be true by default when
# somebody adds a step that runs a dependency's install script.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The FLOOR and the CURRENT release. package.json says >=24, and a floor
        # nobody runs is not a claim, it is a hope — the previous one said 18 and
        # had not been exercised in months. 26 is what developers are on, so both
        # ends are covered.
        node: ['24', '26']
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # The only dependency is the TypeScript used to check the JSDoc, but
          # it is downloaded on every run of every matrix leg without this.
          cache: npm

      - run: npm install --no-audit --no-fund

      # THE WORKER'S DEPENDENCIES, because the tests in test/ import
      # worker/src/worker.js — openapi.test.js, worker-routes.test.js and
      # mcp-remote.test.js all do, to assert the two coordinators agree.
      #
      # This job installed the root only, which was fine for as long as the
      # comment above was true ("no runtime dependencies"). The moment the
      # Worker gained one, every one of those tests failed with
      # ERR_MODULE_NOT_FOUND — and verify.sh passed on my machine, because
      # worker/node_modules was already there from installing it.
      #
      # A local check that cannot fail the way CI fails is a local check that
      # certifies nothing. This is the line that makes them the same run.
      - run: npm install --no-audit --no-fund
        working-directory: worker
      # `npm test` builds the console first (pretest), because node cannot
      # import JSX and the component tests render the compiled output. A UI that
      # cannot be rendered in a test is a UI that ships broken — which is
      # exactly how the hand-rolled version of this page shipped.
      #
      # AND IT IS THE ONLY THING IN THIS JOB, which it did not used to be.
      # Everything else that lived here — the typecheck, two `-n` parses, a
      # JSON comparison, a docker container, an installer run in a second
      # container — cannot answer differently on Node 24 and Node 26, and the
      # matrix ran every one of them twice for two identical results. They are
      # the `checks` job below, once. See the comment on it.
      - run: npm test

  # EVERYTHING THAT CANNOT VARY BY NODE VERSION, once.
  #
  # The split is the whole point: `test` above is a matrix because the suite is
  # the part whose answer depends on the runtime, and nothing else here is. A
  # docker container behaves the same either way; so does `bash -n`; so does
  # comparing two JSON documents. Running them on both legs bought a second
  # identical answer and paid for it in wall-clock on every push.
  #
  # IT RUNS scripts/verify.sh, NOT A COPY OF IT. That script is what anybody
  # working on this runs before committing, and CI reproducing its steps in
  # YAML is how the two drift until "green locally, red on CI" becomes normal —
  # this repository has already paid for that once, when the Worker gained a
  # dependency the local run happened to have installed. VERIFY_SKIP_TESTS
  # leaves the suite to the matrix and runs the other eight checks.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Deep enough for commitlint to see the range below. The default is a
          # single commit, against which `--from base --to head` resolves to
          # nothing and passes — a lint that silently checks zero commits is
          # worse than no lint, because the green tick says it looked.
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          # The current release, not the floor. These checks are about this
          # repository rather than about the range it supports, and the floor is
          # exercised by the matrix above.
          node-version: '26.8.1'
          cache: npm
      - run: npm install --no-audit --no-fund
      # The Worker's, because verify.sh bundles it and the bundle resolves its
      # imports for real.
      - run: npm install --no-audit --no-fund
        working-directory: worker

      # Typecheck, coverage, both Worker bundles, the openapi contract, the
      # workflow sweep, the name check, and both shell parses — the same lines
      # anybody sees locally, with the same names.
      #
      # COVERAGE RUNS HERE AND NOT IN THE MATRIX, which is why it has its own
      # flag (VERIFY_SKIP_COVERAGE) rather than riding on VERIFY_SKIP_TESTS.
      # Coverage is a property of the code, not of the runtime: two matrix legs
      # would produce the same number and pay for a second suite run to do it.
      #
      # SO THE SUITE RUNS THREE TIMES PER PULL REQUEST, and that is worth saying
      # out loud rather than leaving somebody to find it. Twice in the matrix
      # above, and a third time inside check-coverage.mjs here — VERIFY_SKIP_TESTS
      # skips the `tests` LINE, not the run underneath the coverage one, because
      # coverage has to execute the suite to measure it.
      #
      # Three runs of 21 seconds, in parallel with a docker build. It is a real
      # cost and a small one; the alternative is threading a coverage-enabled
      # run out of one matrix leg, which couples the two jobs to save nothing
      # anybody can feel.
      - name: Everything verify.sh checks, except the suite
        env:
          VERIFY_SKIP_TESTS: '1'
        run: ./scripts/verify.sh

      # THE COMMIT MESSAGES, on a pull request only.
      #
      # Not on main: a squash merge takes its body from the PR description,
      # which is markdown with links in it and is not ours to reformat — and by
      # then the commit exists, so a red check tells nobody anything they can
      # act on. On a branch it is still fixable with `git rebase`.
      #
      # NOT CONVENTIONAL COMMITS. commitlint.config.mjs argues that out; the
      # short version is that the subjects here are sentences and a generated
      # `feat(mcp):` changelog would say less while looking more official. What
      # is enforced is the shape: a subject that fits, a blank line, and lines
      # that do not run off the side of a terminal.
      #
      # The checkout above is fetch-depth: 0, so both ends of the range are
      # already here and there is nothing to fetch.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}"

      # THE CONTAINER HALF OF THE SANDBOX, against Docker.
      #
      # test/files-container.test.js is the workspace browser running inside a
      # real container — where the confinement actually lives. It was asserted
      # by reading the source, because CI had no engine. It has Docker, and
      # AGENT_HUB_PODMAN_BIN has always been configurable; what stood in the way
      # was three podman-only subcommands, now `inspect` on both.
      #
      # THE FLEET STILL RUNS PODMAN. docs/hardening.md is built on rootless —
      # NoNewPrivileges against setuid newuidmap, ProtectHome against
      # ~/.local/share/containers. Docker's default is a root daemon, where
      # "escaped the container" and "root on the box" are the same sentence.
      # This is a test running somewhere else, not a change of engine.
      #
      # It found two real bugs on its first run: `sort -t` given two characters
      # instead of a tab, and `podman run -v name:/work` CREATING the volume
      # when absent, so reading a session that did not exist quietly made one
      # under a name the caller chose.
      - name: The workspace, inside a real container
        run: node --test test/files-container.test.js
        env:
          AGENT_HUB_PODMAN_BIN: docker
          AGENT_HUB_SANDBOX_IMAGE: debian:13-slim

      # The installer is the thing a new operator runs first, so a syntax error
      # in it is a worse bug than one in the service.
      - run: bash -n install/install.sh

      # AND IT RUNS, not merely parses.
      #
      # `bash -n` above has passed on every commit of a script that could not
      # get past its own fourth line: previous_install() ended with a
      # `[ -f ] &&` that is false on a box which has never had this installed,
      # so the function returned 1, `set -e` killed the script, and a fresh
      # install died silently. A beta tester found it with their first command.
      # Syntax checking cannot see that; running it can.
      #
      # In a CLEAN CONTAINER, because the failure only exists where nothing is
      # installed — on this runner, or on any machine that has run the
      # installer once, the file it tests for might exist and the bug hides.
      # That is the whole reason it survived: nobody who works on this has a
      # box where it fails.
      #
      # --check is advertised as "nothing will be changed", so running it as
      # root in a throwaway container costs nothing and asserts the claim.
      - name: The installer runs on a machine that has never seen it
        run: |
          docker run --rm -v "$PWD:/src:ro" debian:13-slim sh -c '
            set -e
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq bash >/dev/null 2>&1
            cp -r /src /work
            cd /work
            bash install/install.sh --check
            echo "--- installer --check exited 0 ---"
          ' | tail -20

      # And the bootstrap is checked as SH, not bash. It is the one file here
      # that strangers execute out of a pipe under whatever /bin/sh is, and a
      # bashism in it fails on their box with "Bad substitution" and nothing
      # else. test/bootstrap.test.js runs it for real; this catches the typo
      # before that gets as far as cloning anything.
      - run: sh -n install/bootstrap.sh

      # The openapi drift check and the workflow sweep USED TO BE HERE, as an
      # inline `node -e` and an `npm i --no-save js-yaml`. Both are gone: they
      # duplicated `scripts/sync-openapi.mjs --check` and
      # `scripts/check-workflows.mjs`, which verify.sh above already runs — and
      # the second one downloaded a package on every run of every matrix leg to
      # do less than the checked-in script does. Two implementations of one
      # check is how the weaker one becomes the one that passes.

  # (The Renovate config validator has its own workflow, renovate-config.yml —
  # it runs on its own Node because Renovate declares engines ^24.11.0 and its
  # native re2 module does not load on 26.)

  # THE ONE CHECK TO MAKE REQUIRED, and the reason it exists rather than
  # requiring `test (node 24)` and `checks` directly.
  #
  # A required check is named, and a name is a thing that changes: the matrix
  # legs above have already been 18 and 20, and the day `24` becomes `26` every
  # branch protection rule naming the old leg is waiting for a check that will
  # never report again — silently, and looking like a slow CI rather than a
  # broken gate. This name does not move.
  #
  # `if: always()` so it reports whatever happened above rather than inheriting
  # a skip. Nothing here is gated today, but a future job that is must not be
  # able to turn this gate green by not running — so a skipped dependency passes
  # and a failed or CANCELLED one does not. `success()` alone gets the
  # cancellation case wrong, which is the one that matters: a cancelled run is
  # not a run that said yes.
  gate:
    name: CI passed
    needs: [test, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job above either passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -eu
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a job this gate depends on reported '$r'"; exit 1 ;;
            esac
          done
          echo "CI passed"
